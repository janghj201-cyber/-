<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://vbuhueykvizmnrfvkehq.supabase.co" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dutyvo 로그인</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/dutyvo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/dutyvo-192.png">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icons/dutyvo-apple-180.png">
<link rel="stylesheet" href="lp/dv-auth.css?v=1">
</head>
<body>
  <main class="shell narrow">
    <a class="brand" href="/intro"><img src="icons/dutyvo-mark.svg" alt="">Dutyvo</a>
    <section class="card">
      <h1>로그인</h1>
      <p class="sub">오늘 할 일과 인수인계가 기다리고 있습니다.</p>
      <form id="login-form">
        <label class="f">이메일<input type="email" id="email" required placeholder="you@example.com" autocomplete="email" /></label>
        <label class="f">비밀번호<input type="password" id="password" required autocomplete="current-password" /></label>
        <label class="remember"><input type="checkbox" id="remember" /> 이메일 기억하기</label>
        <p class="err" id="error" hidden></p>
        <div class="acts"><button type="submit" class="btn main" id="submitBtn">로그인</button></div>
      </form>
      <span class="link"><a href="#" id="forgot-link" class="plain">비밀번호를 잊으셨나요?</a></span>
    </section>
    <span class="link">처음이면 <a href="onboarding.html">초대 코드로 시작하기</a> · 직원은 받은 초대 링크로</span>
  </main>

  <script type="module">
    import { supabase } from './adapter/supabase-client.js'

    const { data: { session } } = await supabase.auth.getSession()
    if (session) location.href = 'index.html'

    const form = document.getElementById('login-form')
    const errorEl = document.getElementById('error')
    const submitBtn = document.getElementById('submitBtn')

    // 이메일 기억하기: 저장된 값 복원
    const rememberEl = document.getElementById('remember')
    const savedEmail = localStorage.getItem('vflow_saved_email')
    if (savedEmail) { document.getElementById('email').value = savedEmail; rememberEl.checked = true; document.getElementById('password').focus() }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.hidden = true
      errorEl.className = 'err'
      submitBtn.disabled = true
      submitBtn.textContent = '로그인 중...'
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        })
        if (error) throw error
        if (rememberEl.checked) localStorage.setItem('vflow_saved_email', document.getElementById('email').value.trim())
        else localStorage.removeItem('vflow_saved_email')
        location.href = 'index.html'
      } catch (err) {
        errorEl.textContent = err.message || '로그인에 실패했습니다.'
        errorEl.hidden = false
        submitBtn.disabled = false
        submitBtn.textContent = '로그인'
      }
    })

    // 비밀번호 찾기 — 이메일로 재설정 링크 발송
    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault()
      const email = (document.getElementById('email').value || '').trim()
      if (!email) { errorEl.textContent = '먼저 이메일을 입력한 뒤 눌러주세요.'; errorEl.hidden = false; return }
      errorEl.hidden = true
      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + location.pathname.replace(/login\.html$/, '') + 'reset-password.html',
        })
        if (error) throw error
        errorEl.className = 'okmsg'
        errorEl.textContent = email + ' 로 재설정 링크를 보냈습니다. 메일함(스팸함 포함)을 확인해 주세요.'
        errorEl.hidden = false
      } catch (err) {
        errorEl.className = 'err'
        errorEl.textContent = err.message || '메일 발송에 실패했습니다. 잠시 후 다시 시도해 주세요.'
        errorEl.hidden = false
      }
    })
  </script>
</body>
</html>
