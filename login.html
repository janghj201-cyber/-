<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://vbuhueykvizmnrfvkehq.supabase.co" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V-Flow 로그인</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-v2.png">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7f2;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
  h2{margin:0 0 8px;color:#1a2332;}
  p{color:#6b7a8d;font-size:14px;margin:0 0 20px;}
  label{display:block;font-size:13px;color:#1a2332;margin-bottom:6px;margin-top:14px;}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e8e4dc;border-radius:8px;font-size:14px;}
  button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:8px;background:#1a2332;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:0.6;cursor:default;}
  .error{color:#c0392b;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
  <div class="card">
    <h2>매장 스케줄 앱</h2>
    <p>로그인하고 오늘 업무를 시작하세요.</p>
    <form id="login-form">
      <label>이메일<input type="email" id="email" required placeholder="you@example.com" /></label>
      <label>비밀번호<input type="password" id="password" required /></label>
      <label style="display:flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;cursor:pointer;"><input type="checkbox" id="remember" style="width:auto;margin:0;" /> 이메일 기억하기</label>
      <p class="error" id="error" hidden></p>
      <button type="submit" id="submitBtn">로그인</button>
    </form>
    <p style="text-align:center;margin:14px 0 0;font-size:13px;"><a href="#" id="forgot-link" style="color:#6b7a8d;text-decoration:underline;">비밀번호를 잊으셨나요?</a></p>
    <p style="text-align:center;margin:16px 0 0;font-size:13px;color:#6b7a8d;">처음이세요? <a href="onboarding.html" style="color:#f5a623;font-weight:700;">회원가입하고 시작하기</a></p>
  </div>

  <script type="module">
    import { supabase } from './adapter/supabase-client.js'

    const { data: { session } } = await supabase.auth.getSession()
    if (session) location.href = 'index.html'

    const form = document.getElementById('login-form')
    const errorEl = document.getElementById('error')
    const submitBtn = document.getElementById('submitBtn')

    // 이메일 기억하기: 저장된 값 복원
    const rememberEl = document.getElementById('remember')
    const savedEmail = localStorage.getItem('vflow_saved_email')
    if (savedEmail) { document.getElementById('email').value = savedEmail; rememberEl.checked = true; document.getElementById('password').focus() }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.hidden = true
      submitBtn.disabled = true
      submitBtn.textContent = '로그인 중...'
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        })
        if (error) throw error
        if (rememberEl.checked) localStorage.setItem('vflow_saved_email', document.getElementById('email').value.trim())
        else localStorage.removeItem('vflow_saved_email')
        location.href = 'index.html'
      } catch (err) {
        errorEl.textContent = err.message || '로그인에 실패했습니다.'
        errorEl.hidden = false
        submitBtn.disabled = false
        submitBtn.textContent = '로그인'
      }
    })

    // 비밀번호 찾기 — 이메일로 재설정 링크 발송
    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault()
      const email = (document.getElementById('email').value || '').trim()
      if (!email) { errorEl.textContent = '먼저 이메일을 입력한 뒤 눌러주세요.'; errorEl.hidden = false; return }
      errorEl.hidden = true
      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + location.pathname.replace(/login\.html$/, '') + 'reset-password.html',
        })
        if (error) throw error
        errorEl.style.color = '#0f766e'
        errorEl.textContent = '✓ ' + email + ' 로 재설정 링크를 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.'
        errorEl.hidden = false
      } catch (err) {
        errorEl.style.color = '#c0392b'
        errorEl.textContent = err.message || '메일 발송에 실패했습니다. 잠시 후 다시 시도해 주세요.'
        errorEl.hidden = false
      }
    })
  </script>
</body>
</html>
