<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeVape 로그인</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7f2;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
  h2{margin:0 0 8px;color:#1a2332;}
  p{color:#6b7a8d;font-size:14px;margin:0 0 20px;}
  label{display:block;font-size:13px;color:#1a2332;margin-bottom:6px;margin-top:14px;}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e8e4dc;border-radius:8px;font-size:14px;}
  button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:8px;background:#1a2332;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:0.6;cursor:default;}
  .error{color:#c0392b;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
  <div class="card">
    <h2>WeVape 스케줄 앱</h2>
    <p>Supabase 어댑터 검증용 로그인 (1단계: 게시판)</p>
    <form id="login-form">
      <label>이메일<input type="email" id="email" required placeholder="test2@vflow.com" /></label>
      <label>비밀번호<input type="password" id="password" required /></label>
      <p class="error" id="error" hidden></p>
      <button type="submit" id="submitBtn">로그인</button>
    </form>
  </div>

  <script type="module">
    import { supabase } from './adapter/supabase-client.js'

    const { data: { session } } = await supabase.auth.getSession()
    if (session) location.href = 'index.html'

    const form = document.getElementById('login-form')
    const errorEl = document.getElementById('error')
    const submitBtn = document.getElementById('submitBtn')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.hidden = true
      submitBtn.disabled = true
      submitBtn.textContent = '로그인 중...'
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        })
        if (error) throw error
        location.href = 'index.html'
      } catch (err) {
        errorEl.textContent = err.message || '로그인에 실패했습니다.'
        errorEl.hidden = false
        submitBtn.disabled = false
        submitBtn.textContent = '로그인'
      }
    })
  </script>
</body>
</html>
