  content.appendChild(dateEl);

  for(const store of STORES){
    const card=document.createElement('div');card.className='dash-card';

    const nameDiv=document.createElement('div');nameDiv.className='dash-store-name';
    nameDiv.innerHTML=`${store.icon} ${store.name} <span class="dash-store-badge" id="badge-${store.id}"></span>`;
    card.appendChild(nameDiv);

    // 청소 진행률
    const pbWrap=document.createElement('div');pbWrap.className='progress-bar';
    const pbFill=document.createElement('div');pbFill.className='progress-fill';pbFill.style.width='0%';
    pbWrap.appendChild(pbFill);
    const statsEl=document.createElement('div');statsEl.className='dash-stats';
    statsEl.innerHTML=`<span id="stat-${store.id}">불러오는 중...</span><span>${cleanLabel}</span>`;
    card.appendChild(pbWrap);card.appendChild(statsEl);

    // 오늘의 업무 진행률
    const todoStats=document.createElement('div');todoStats.className='dash-todo-summary';
    todoStats.id=`todostat-${store.id}`;
    todoStats.textContent='📝 오늘의 업무 불러오는 중...';
    card.appendChild(todoStats);

    // 상세보기 토글 + 상세 영역
    const toggleBtn=document.createElement('button');toggleBtn.className='dash-toggle';toggleBtn.id=`toggle-${store.id}`;
    toggleBtn.textContent='🔍 상세보기 (항목별 현황)';
    card.appendChild(toggleBtn);

    const detailWrap=document.createElement('div');detailWrap.className='dash-detail';detailWrap.id=`detail-${store.id}`;
    detailWrap.innerHTML=`<div class="dash-detail-title">${cleanLabel}</div>
      <div class="dash-items" id="cleanitems-${store.id}"></div>
      <div class="dash-detail-title">📝 오늘의 업무</div>
      <div class="dash-todo-list" id="todoitems-${store.id}"><div class="no-clean">불러오는 중...</div></div>`;
    card.appendChild(detailWrap);

    toggleBtn.onclick=()=>{
      const open=detailWrap.classList.toggle('open');
      toggleBtn.textContent=open?'🔼 상세 닫기':'🔍 상세보기 (항목별 현황)';
    };

    // 청소 항목 (기본청소 6 + 대청소일이면 구역항목) 뼈대 렌더
    const cleanItemList=cleanEv?[...CLEAN_BASE,...CSECTIONS[cleanEv.sec-1].items]:[...CLEAN_BASE];
    const cleanItemsWrap=detailWrap.querySelector(`#cleanitems-${store.id}`);
    cleanItemList.forEach((item,ii)=>{
      const row=document.createElement('div');row.className='dash-item';
      row.innerHTML=`<div class="dash-check undone" id="dck-${store.id}-${ii}">✓</div>
        <span class="dash-item-name" id="dname-${store.id}-${ii}">${item}</span>`;
      cleanItemsWrap.appendChild(row);
    });

    // 관리자 피드백 입력 영역
    const fbAdminWrap=document.createElement('div');fbAdminWrap.className='feedback-box';
    const fbSavedEl=document.createElement('div');fbSavedEl.className='feedback-saved';
    fbAdminWrap.innerHTML=`<div class="feedback-label">✏️ 피드백 작성</div>`;
    const fbTextarea=document.createElement('textarea');
    fbTextarea.className='feedback-textarea';
    fbTextarea.placeholder='직원들에게 전달할 피드백을 입력하세요...';
    fbTextarea.rows=3;
    const fbSaveBtn=document.createElement('button');
    fbSaveBtn.className='feedback-save-btn';
    fbSaveBtn.textContent='💾 저장하기';
    fbAdminWrap.appendChild(fbTextarea);
    fbAdminWrap.appendChild(fbSaveBtn);
    fbAdminWrap.appendChild(fbSavedEl);
    card.appendChild(fbAdminWrap);

    content.appendChild(card);

    // 기존 피드백 로드
    const fbRef=doc(db,`feedback/${store.id}/${tKey}/comment`);
    getDoc(fbRef).then(snap=>{
      if(snap.exists()&&snap.data().text){
        fbTextarea.value=snap.data().text;
      }
    });

    fbSaveBtn.onclick=async()=>{
      const text=fbTextarea.value.trim();
      fbSavedEl.textContent='저장 중...';
      try{
        const now=new Date();
        const ts=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        await setDoc(fbRef,{text,updatedAt:ts});
        fbSavedEl.textContent='✓ 저장됨';
        setTimeout(()=>fbSavedEl.textContent='',2000);
      }catch(e){fbSavedEl.textContent='⚠ 저장 실패';}
    };

    // 청소 실시간 리스닝
    const cleanRef=doc(db,`checks/${store.id}/${tKey}/clean`);
    const unsub1=onSnapshot(cleanRef,(snap)=>{
      const data=snap.exists()?snap.data():{};
      const done=Object.values(data).filter(Boolean).length;
      const pct=totalClean>0?Math.round(done/totalClean*100):0;
      pbFill.style.width=pct+'%';
      pbFill.className='progress-fill'+(done===0?' empty':done<totalClean?' warn':'');
      const statEl=document.getElementById(`stat-${store.id}`);
      if(statEl)statEl.textContent=`${done} / ${totalClean} 완료 (${pct}%)`;
      const badge=document.getElementById(`badge-${store.id}`);
      if(badge){
        if(done>=totalClean&&totalClean>0){badge.style.cssText='background:var(--green-light);color:var(--green)';badge.textContent='✅ 완료';}
        else if(done>0){badge.style.cssText='background:#fef3c7;color:#92400e';badge.textContent='🟡 진행중';}
        else{badge.style.cssText='background:#f3f4f6;color:#9ca3af';badge.textContent='⬜ 미완료';}
      }
      // 항목별 상세
      cleanItemList.forEach((item,ii)=>{
        const checked=!!data[`item_${ii}`];
        const ck=document.getElementById(`dck-${store.id}-${ii}`);
        const nm=document.getElementById(`dname-${store.id}-${ii}`);
        if(ck)ck.className='dash-check '+(checked?'done':'undone');
        if(nm)nm.className='dash-item-name '+(checked?'done':'');
      });
    });
    dashUnsubs.push(unsub1);

    // 오늘의 업무 실시간 리스닝
    const todoRef=doc(db,`todos/${store.id}_${tKey}`);
    const unsub2=onSnapshot(todoRef,(snap)=>{
      const items=snap.exists()?(snap.data().items||[]):[];
      const done=items.filter(i=>i.done).length;
      const el=document.getElementById(`todostat-${store.id}`);
      if(el)el.textContent=`📝 오늘의 업무: ${done} / ${items.length} 완료`;
      // 항목별 상세
      const todoItemsWrap=document.getElementById(`todoitems-${store.id}`);
      if(todoItemsWrap){
        if(items.length===0){
          todoItemsWrap.innerHTML='<div class="no-clean">등록된 업무 없음</div>';
        }else{
          todoItemsWrap.innerHTML='';
          items.forEach(it=>{
            const carry=(it.fromDate&&it.fromDate!==tKey)?` <span style="color:var(--orange)">[${it.fromDate.slice(5)} 이월]</span>`:'';
            const row=document.createElement('div');row.className='dash-todo-item'+(it.done?' done':'');
            row.innerHTML=`<span class="ico">${it.done?'✅':'⬜'}</span><span class="txt">${it.text} <span style="color:#bbb">(${it.author||'익명'})</span>${carry}</span>`;
            todoItemsWrap.appendChild(row);
          });
        }
      }
    });
    dashUnsubs.push(unsub2);
  }
}

// ── 탭 2: 일일 보고 (날짜 이동, 전날 기본값, 어제 10시 이후 잠금 확정) ──
async function renderReportTab(content){
  if(!dashViewDate){
    const yest=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);
    dashViewDate={y:yest.getFullYear(),m:yest.getMonth(),d:yest.getDate()};
  }
  const {y,m,d}=dashViewDate;
  const dateKey=dk(y,m,d);
  const dows=['일','월','화','수','목','금','토'];
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const dow=new Date(y,m,d).getDay();

  document.getElementById('dash-sub').textContent='지점별 일일 업무 보고';

  const nav=document.createElement('div');nav.className='dash-datenav';
  const todayDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const viewDate=new Date(y,m,d);
  const nextDate=new Date(y,m,d+1);
  const isYesterday=Math.round((todayDate-viewDate)/86400000)===1;
  nav.innerHTML=`<button id="rep-prev">‹</button>
    <span class="dash-datenav-label">${y}년 ${mns[m]} ${d}일 (${dows[dow]})${isYesterday?' · 어제':''}</span>
    <button id="rep-next" ${nextDate>=todayDate?'disabled':''}>›</button>`;
  content.appendChild(nav);
  nav.querySelector('#rep-prev').onclick=()=>{
    const nd=new Date(y,m,d-1);
    dashViewDate={y:nd.getFullYear(),m:nd.getMonth(),d:nd.getDate()};
    renderDashboard();
  };
  const nextBtn=nav.querySelector('#rep-next');
  if(!nextBtn.disabled){
    nextBtn.onclick=()=>{
      const nd=new Date(y,m,d+1);
      dashViewDate={y:nd.getFullYear(),m:nd.getMonth(),d:nd.getDate()};
      renderDashboard();
    };
  }

  if(isYesterday&&new Date().getHours()<10){
    const noticeEl=document.createElement('div');noticeEl.className='dash-date';
    noticeEl.textContent='⏰ 오전 10시 이후 전일 데이터가 최종 확정됩니다 (그 전까지는 직원이 수정 가능)';
    content.appendChild(noticeEl);
  }

  const totalClean=getCleanItemCount(y,m,d);
  const evs=getEvs(y,m,d);
  const cleanEv=evs.find(e=>e.t==='clean');
  const cleanLabel=cleanEv?`🧹 대청소 ${cleanEv.sec}구역`:'청소 및 매장 정리';

  for(const store of STORES){
    const card=document.createElement('div');card.className='dash-card';

    const cleanSnap=await getDoc(doc(db,`checks/${store.id}/${dateKey}/clean`));
    const cleanData=cleanSnap.exists()?cleanSnap.data():{};
    const cleanDone=Object.values(cleanData).filter(Boolean).length;

    const todoSnap=await getDoc(doc(db,`todos/${store.id}_${dateKey}`));
    const items=todoSnap.exists()?(todoSnap.data().items||[]):[];
    const todoDone=items.filter(i=>i.done).length;
    const authors=[...new Set(items.map(i=>i.author).filter(Boolean))];

    let html=`<div class="dash-store-name">${store.icon} ${store.name}</div>`;
    html+=`<div class="dash-workers">👤 근무자: ${authors.length?authors.join(', '):'기록 없음'}</div>`;
    html+=`<div class="dash-section-title">${cleanLabel}</div>`;
    const cleanIcon=(totalClean>0&&cleanDone>=totalClean)?'✅':(cleanDone>0?'🟡':'⬜');
    html+=`<div class="dash-stats" style="margin-bottom:4px"><span>${cleanDone} / ${totalClean} 완료</span><span>${cleanIcon}</span></div>`;
    html+=`<div class="dash-section-title">📝 오늘의 업무 (${todoDone}/${items.length})</div>`;
    if(items.length===0){
      html+=`<div class="no-clean">등록된 업무 없음</div>`;
    }else{
      html+=`<div class="dash-todo-list">`;
      items.forEach(it=>{
        const carry=(it.fromDate&&it.fromDate!==dateKey)?` <span style="color:var(--orange)">[${it.fromDate.slice(5)} 이월]</span>`:'';
        html+=`<div class="dash-todo-item${it.done?' done':''}"><span class="ico">${it.done?'✅':'⬜'}</span><span class="txt">${it.text} <span style="color:#bbb">(${it.author||'익명'})</span>${carry}</span></div>`;
      });
      html+=`</div>`;
    }
    card.innerHTML=html;
    content.appendChild(card);
  }
}

// ── 탭 3: 월간 통계 (이번 달 누적) ──
async function renderMonthlyTab(content){
  document.getElementById('dash-sub').textContent='이번 달 지점별 누적 통계';
  const y=today.getFullYear(),m=today.getMonth();
  const lastDay=Math.min(today.getDate()-1,new Date(y,m+1,0).getDate());
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  if(lastDay<1){
    content.innerHTML=`<div class="monthly-loading">아직 누적된 데이터가 없습니다 (월초)</div>`;
    return;
  }

  content.innerHTML=`<div class="monthly-loading">데이터 집계 중... (1~${lastDay}일)</div>`;

  const results=[];
  for(const store of STORES){
    let cleanDone=0,cleanTotal=0,todoDone=0,todoTotal=0;
    for(let d=1;d<=lastDay;d++){
      const dateKey=dk(y,m,d);
      cleanTotal+=getCleanItemCount(y,m,d);
      try{
        const cSnap=await getDoc(doc(db,`checks/${store.id}/${dateKey}/clean`));
        if(cSnap.exists())cleanDone+=Object.values(cSnap.data()).filter(Boolean).length;
      }catch(e){}
      try{
        const tSnap=await getDoc(doc(db,`todos/${store.id}_${dateKey}`));
        if(tSnap.exists()){
          const items=tSnap.data().items||[];
          todoTotal+=items.length;
          todoDone+=items.filter(i=>i.done).length;
        }
      }catch(e){}
    }
    results.push({store,cleanDone,cleanTotal,todoDone,todoTotal});
  }

  let html=`<div class="dash-date">${mns[m]} 1일 ~ ${lastDay}일 누적</div>`;
  html+=`<table class="monthly-table"><tr><th>지점</th><th>청소</th><th>오늘의 업무</th></tr>`;
  results.forEach(r=>{
    const cleanPct=r.cleanTotal>0?Math.round(r.cleanDone/r.cleanTotal*100):0;
    const todoPct=r.todoTotal>0?Math.round(r.todoDone/r.todoTotal*100):0;
    html+=`<tr><td>${r.store.icon} ${r.store.name}</td><td>${r.cleanDone}/${r.cleanTotal} (${cleanPct}%)</td><td>${r.todoTotal>0?`${r.todoDone}/${r.todoTotal} (${todoPct}%)`:'-'}</td></tr>`;
  });
  html+=`</table>`;
  content.innerHTML=html;
}

};
window.checkPw=function(){
  const val=document.getElementById('pw-input').value;
  if(val===ADMIN_PW){
    document.getElementById('pw-modal').style.display='none';
    isAdmin=true;
    dashTab='today';
    dashViewDate=null;
    showScreen('screen-admin');
    renderDashboard();
  } else {
    document.getElementById('pw-err').textContent='비밀번호가 틀렸습니다';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
};
