<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>위베이프 일정표</title>
<meta name="theme-color" content="#0f7a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="위베이프 일정">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --green:#0f7a6b;--green-light:#e6f4f1;
  --blue:#1a6fb5;--blue-light:#e8f2fb;
  --orange:#c97a1a;--orange-light:#fdf3e3;
  --purple:#6b3fa0;--purple-light:#f1ecfa;
  --red:#c0392b;--red-light:#fdecea;
  --pink:#b5186a;--pink-light:#fce8f3;
  --teal:#0e7490;--teal-light:#e0f5f9;
  --bg:#f4f1ea;--white:#fff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:#222;min-height:100dvh;padding-top:var(--safe-top);}

/* ── 공통 헤더 ── */
.header{background:var(--green);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:17px;font-weight:700;}
.header-sub{font-size:11px;opacity:0.8;margin-top:1px;}
.nav-btns{display:flex;gap:6px;align-items:center;}
.nav-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;font-family:inherit;}
.today-btn{font-size:12px;background:rgba(255,255,255,0.3);}
.back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.admin-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;}

/* ── 화면 전환 ── */
.screen{display:none;}
.screen.active{display:block;}

/* ── 지점 선택 화면 ── */
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;}
.store-card{background:var(--white);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:transform 0.15s,box-shadow 0.15s;border:2px solid transparent;}
.store-card:active{transform:scale(0.97);}
.store-card:hover{box-shadow:0 4px 16px rgba(15,122,107,0.15);border-color:var(--green-light);}
.store-icon{font-size:28px;margin-bottom:8px;}
.store-name{font-size:14px;font-weight:700;color:#222;line-height:1.3;}
.store-area{font-size:11px;color:#888;margin-top:3px;}
.store-today{margin-top:8px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block;}
.today-done{background:var(--green-light);color:var(--green);}
.today-pending{background:#fef3c7;color:#92400e;}
.today-none{background:#f3f4f6;color:#9ca3af;}

/* ── 달력 ── */
.cal-wrap{background:var(--white);margin:12px;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);background:#f9f8f5;}
.wd{text-align:center;font-size:11px;font-weight:600;padding:8px 0;color:#666;}
.wd:first-child{color:var(--red);}
.wd:last-child{color:var(--blue);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day{min-height:62px;padding:5px 4px 4px;border-top:0.5px solid #ede9e0;cursor:pointer;transition:background 0.12s;}
.day:hover{background:#f7f5f0;}
.day.selected{background:var(--green-light);}
.day.today .day-num{background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 2px;}
.day-num{font-size:13px;font-weight:500;text-align:center;margin-bottom:3px;line-height:1;}
.day.other-month .day-num{color:#bbb;}
.day.sun .day-num{color:var(--red);}
.day.sat .day-num{color:var(--blue);}
.day.today.sun .day-num,.day.today.sat .day-num{color:#fff;}
.badges{display:flex;flex-direction:column;gap:2px;}
.badge{font-size:9px;font-weight:600;border-radius:3px;padding:1px 3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.b-blue{background:var(--blue-light);color:var(--blue);}
.b-orange{background:var(--orange-light);color:var(--orange);}
.b-purple{background:var(--purple-light);color:var(--purple);}
.b-red{background:var(--red-light);color:var(--red);}
.b-green{background:var(--green-light);color:var(--green);}
.b-pink{background:var(--pink-light);color:var(--pink);}
.b-teal{background:var(--teal-light);color:var(--teal);}
.b-teal2{background:var(--teal);color:#fff;}

/* ── 상세 패널 ── */
.detail{margin:0 12px 12px;background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.detail-header{padding:14px 16px 10px;border-bottom:1px solid #ede9e0;}
.detail-date{font-size:16px;font-weight:700;}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.dtag{font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;}
.task-list{padding:8px 0;}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;cursor:pointer;}
.task:hover{background:#f9f8f5;}
.task-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.c-green{background:var(--green);}
.c-blue{background:var(--blue);}
.c-orange{background:var(--orange);}
.c-purple{background:var(--purple);}
.c-pink{background:var(--pink);}
.c-teal{background:var(--teal);}
.task-name{font-size:14px;font-weight:600;line-height:1.3;}
.task-meta{font-size:12px;color:#888;margin-top:2px;line-height:1.4;}
.task-expand{margin-left:auto;font-size:18px;color:#bbb;flex-shrink:0;}

/* ── 체크리스트 ── */
.checklist-wrap{background:#f9f8f5;border-top:1px solid #ede9e0;padding:12px 16px;}
.checklist-section{margin-bottom:14px;}
.section-title{font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;padding:4px 8px;background:var(--green-light);border-radius:6px;display:inline-block;}
.section-title.active-section{background:var(--green);color:#fff;}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid #ede9e0;}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);margin-top:1px;flex-shrink:0;cursor:pointer;}
.check-item label{font-size:13px;color:#333;line-height:1.4;cursor:pointer;}
.check-item input:checked+label{text-decoration:line-through;color:#aaa;}
.checklist-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid #ddd;margin-top:4px;}
.check-count{font-size:13px;font-weight:600;color:var(--green);}
.reset-btn{font-size:12px;color:#888;background:none;border:0.5px solid #ccc;border-radius:6px;padding:4px 10px;cursor:pointer;}
.sync-status{font-size:11px;color:#aaa;margin-top:6px;text-align:right;}

/* ── 패널들 ── */
.report-wrap{background:#fff5f9;border-top:1px solid #ede9e0;padding:12px 16px;}
.report-title{font-size:13px;font-weight:700;color:var(--pink);margin-bottom:8px;}
.report-guide{font-size:12px;color:#555;line-height:1.7;padding-left:0;}
.report-guide li{list-style:none;padding-left:14px;position:relative;margin-bottom:4px;}
.report-guide li::before{content:"·";position:absolute;left:0;color:var(--pink);}
.as-wrap{background:#e8f8fb;border-top:1px solid #ede9e0;padding:12px 16px;}
.as-title{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:8px;}
.as-guide{font-size:12px;color:#555;line-height:1.7;padding-left:0;}
.as-guide li{list-style:none;padding-left:14px;position:relative;margin-bottom:4px;}
.as-guide li::before{content:"·";position:absolute;left:0;color:var(--teal);}

/* ── 관리자 피드백 ── */
.feedback-box{margin-top:12px;border-top:1px solid #ede9e0;padding-top:12px;}
.feedback-label{font-size:11px;font-weight:700;color:#888;letter-spacing:0.5px;margin-bottom:6px;}
.feedback-content{font-size:13px;color:#333;line-height:1.6;background:#fffbf0;border-radius:8px;padding:10px 12px;border-left:3px solid var(--orange);min-height:40px;}
.feedback-empty{font-size:12px;color:#bbb;font-style:italic;}
.feedback-textarea{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.6;min-height:80px;}
.feedback-textarea:focus{border-color:var(--orange);}
.feedback-save-btn{margin-top:8px;width:100%;padding:10px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.feedback-save-btn:active{opacity:0.85;}
.feedback-saved{font-size:11px;color:var(--green);margin-top:4px;text-align:right;min-height:16px;}

/* ── 범례 ── */
.legend{margin:0 12px 16px;background:var(--white);border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.legend-title{font-size:11px;font-weight:700;color:#888;margin-bottom:8px;letter-spacing:0.5px;}
.legend-items{display:flex;flex-wrap:wrap;gap:8px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#555;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── 관리자 대시보드 ── */
.dash-wrap{padding:12px;}
.dash-date{font-size:13px;color:#888;margin-bottom:12px;padding:0 4px;}
.dash-card{background:var(--white);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.dash-store-name{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.dash-store-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;}
.progress-bar{background:#f0f0ee;border-radius:999px;height:10px;overflow:hidden;margin-bottom:6px;}
.progress-fill{height:100%;border-radius:999px;transition:width 0.5s ease;background:var(--green);}
.progress-fill.warn{background:var(--orange);}
.progress-fill.empty{background:#e5e7eb;}
.dash-stats{display:flex;justify-content:space-between;font-size:12px;color:#888;}
.dash-items{margin-top:10px;display:flex;flex-direction:column;gap:4px;}
.dash-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:0.5px solid #f0eeea;}
.dash-item:last-child{border-bottom:none;}
.dash-check{width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.dash-check.done{background:var(--green);color:#fff;}
.dash-check.undone{background:#f0f0ee;color:#ccc;}
.dash-item-name{color:#444;}
.dash-item-name.done{text-decoration:line-through;color:#bbb;}
.no-clean{font-size:12px;color:#bbb;padding:6px 0;}
.dash-refresh{display:block;margin:8px auto 0;background:none;border:0.5px solid #ccc;border-radius:8px;padding:6px 16px;font-size:12px;color:#888;cursor:pointer;font-family:inherit;}

/* ── 오늘의 업무 ── */
.todo-section{border-top:1px solid #ede9e0;padding:14px 16px;background:#fafaf8;}
.todo-header{font-size:13px;font-weight:700;color:#444;margin-bottom:10px;}
.lock-badge{font-size:10px;font-weight:600;background:#f0f0ee;color:#999;padding:2px 8px;border-radius:10px;margin-left:6px;}
.todo-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.todo-empty{font-size:12px;color:#bbb;padding:8px 0;text-align:center;}
.todo-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
.todo-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);margin-top:1px;flex-shrink:0;cursor:pointer;}
.todo-text-wrap{flex:1;}
.todo-text{font-size:13px;color:#333;line-height:1.4;}
.todo-item.done .todo-text{text-decoration:line-through;color:#bbb;}
.todo-author{font-size:11px;color:#999;margin-top:2px;}
.todo-carry{font-size:10px;color:var(--orange);background:var(--orange-light);padding:1px 6px;border-radius:8px;margin-left:6px;}
.todo-input-row{display:flex;gap:6px;}
.todo-input{flex:1;border:1.5px solid #ddd;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;}
.todo-input:focus{border-color:var(--green);}
.todo-add-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.todo-add-btn:active{opacity:0.85;}
.todo-locked-msg{font-size:12px;color:#999;text-align:center;padding:8px;background:#f0f0ee;border-radius:8px;}
.todo-bulk-toggle{display:block;margin-top:6px;background:none;border:none;color:var(--green);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:underline;padding:2px 0;}
.todo-bulk-wrap{margin-top:6px;}
.todo-bulk-textarea{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.6;min-height:90px;}
.todo-bulk-textarea:focus{border-color:var(--green);}
.todo-bulk-btns{display:flex;gap:6px;margin-top:6px;}
.todo-bulk-btns .todo-add-btn{flex:1;}
.todo-error{font-size:12px;color:var(--red);padding:8px 0;text-align:center;}

/* ── 관리자 탭/날짜네비/월간통계 ── */
.dash-tabs{display:flex;gap:6px;padding:0 12px 12px;}
.dash-tab{flex:1;padding:9px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:#f0f0ee;color:#888;}
.dash-tab.active{background:var(--green);color:#fff;}
.dash-datenav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
.dash-datenav button{background:var(--white);border:1px solid #ddd;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;}
.dash-datenav button:disabled{opacity:0.3;cursor:default;}
.dash-datenav-label{font-size:13px;font-weight:700;color:#444;min-width:130px;text-align:center;}
.dash-section-title{font-size:12px;font-weight:700;color:#888;margin:14px 0 6px 2px;}
.dash-workers{font-size:12px;color:#666;margin-bottom:8px;}
.dash-todo-summary{font-size:12px;color:#888;margin-top:6px;}
.dash-todo-list{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
.dash-todo-item{display:flex;align-items:flex-start;gap:6px;font-size:12px;padding:3px 0;}
.dash-todo-item .ico{flex-shrink:0;margin-top:1px;}
.dash-todo-item.done .txt{text-decoration:line-through;color:#bbb;}
.monthly-table{width:100%;border-collapse:collapse;margin-top:8px;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.monthly-table th,.monthly-table td{padding:10px 8px;font-size:12px;text-align:center;border-bottom:1px solid #f0eeea;}
.monthly-table th{color:#888;font-weight:600;background:#f9f8f5;}
.monthly-table td:first-child,.monthly-table th:first-child{text-align:left;}
.monthly-loading{text-align:center;font-size:12px;color:#999;padding:30px 0;}

/* ── 비밀번호 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:20px;padding:28px 24px;width:280px;text-align:center;}
.modal h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.modal p{font-size:13px;color:#888;margin-bottom:16px;}
.modal input{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:10px 14px;font-size:16px;text-align:center;letter-spacing:4px;font-family:inherit;outline:none;}
.modal input:focus{border-color:var(--green);}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.modal-btn.cancel{background:#f3f4f6;color:#666;}
.modal-btn.confirm{background:var(--green);color:#fff;}
.modal-err{font-size:12px;color:var(--red);margin-top:8px;min-height:16px;}

/* ── 설치 배너 ── */
.install-banner{background:var(--green);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.5;}
.install-banner .ibtn{background:rgba(255,255,255,0.25);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;white-space:nowrap;}
.install-banner .xbtn{margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;padding:0 2px;}
.pb{height:calc(20px + var(--safe-bot));}
</style>
</head>
<body>

<!-- 설치 배너 -->
<div id="ibanner" class="install-banner" style="display:none">
  <span id="imsg"></span>
  <button class="ibtn" id="ibtn" style="display:none">홈 화면에 추가</button>
  <button class="xbtn" onclick="document.getElementById('ibanner').style.display='none'">×</button>
</div>

<!-- 비밀번호 모달 -->
<div class="modal-bg" id="pw-modal" style="display:none">
  <div class="modal">
    <h3>🔐 관리자 모드</h3>
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="pw-input" maxlength="20" placeholder="••••••">
    <div class="modal-err" id="pw-err"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePwModal()">취소</button>
      <button class="modal-btn confirm" onclick="checkPw()">확인</button>
    </div>
  </div>
</div>

<!-- 이름 입력 모달 -->
<div class="modal-bg" id="name-modal" style="display:none">
  <div class="modal">
    <h3>👤 이름 입력</h3>
    <p>업무 등록 시 표시될 이름을 입력해 주세요</p>
    <input type="text" id="name-input" maxlength="10" placeholder="예: 김민지" style="letter-spacing:normal;text-align:center;">
    <div class="modal-btns">
      <button class="modal-btn confirm" style="flex:1" onclick="confirmName()">확인</button>
    </div>
  </div>
</div>

<!-- ① 지점 선택 화면 -->
<div class="screen active" id="screen-home">
  <div class="header">
    <div><div class="header-title">📋 위베이프 일정표</div><div class="header-sub">지점을 선택하세요</div></div>
    <button class="admin-btn" onclick="openPwModal()">🔐 관리자</button>
  </div>
  <div class="store-grid" id="store-grid"></div>
  <div class="pb"></div>
</div>

<!-- ② 캘린더 화면 -->
<div class="screen" id="screen-cal">
  <div class="header">
    <div><div class="header-title" id="cal-store-title"></div><div class="header-sub" id="hsub"></div></div>
    <div class="nav-btns">
      <button class="back-btn" onclick="goHome()">← 지점</button>
      <button class="nav-btn" onclick="chg(-1)">‹</button>
      <button class="nav-btn today-btn" onclick="goToday()">오늘</button>
      <button class="nav-btn" onclick="chg(1)">›</button>
    </div>
  </div>
  <div class="cal-wrap">
    <div class="weekday-row">
      <div class="wd">일</div><div class="wd">월</div><div class="wd">화</div>
      <div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd">토</div>
    </div>
    <div class="cal-grid" id="grid"></div>
  </div>
  <div class="detail" id="detail" style="display:none">
    <div class="detail-header">
      <div class="detail-date" id="ddate"></div>
      <div class="detail-tags" id="dtags"></div>
    </div>
    <div class="task-list" id="tlist"></div>
    <div id="todo-container"></div>

function pad(n){return String(n).padStart(2,'0');}
function dk(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function todayKey(){return dk(today.getFullYear(),today.getMonth(),today.getDate());}
function sundays(y,m){let s=[],d=new Date(y,m,1);while(d.getMonth()===m){if(d.getDay()===0)s.push(d.getDate());d.setDate(d.getDate()+1);}return s;}

function getAsSendDate(y,m){
  let d=16;
  while(d>=1){
    const dow=new Date(y,m,d).getDay();
    const key=dk(y,m,d);
    if(dow!==0&&dow!==6&&!HOLIDAYS[key])return d;
    d--;
  }
  return 16;
}

function getEvs(y,m,d){
  const ev=[],dow=new Date(y,m,d).getDay(),key=dk(y,m,d);
  if(HOLIDAYS[key])ev.push({t:'holiday',label:HOLIDAYS[key]});
  if(dow===1)ev.push({t:'order'});
  if(d===1||d===2)ev.push({t:'stock'});
  if(d===8)ev.push({t:'pod'});
  if(d===22)ev.push({t:'aio'});
  if(d===25)ev.push({t:'report'});
  if(d===15)ev.push({t:'as_deadline'});
  if(d===getAsSendDate(y,m))ev.push({t:'as_send'});
  if(dow===0){const ss=sundays(y,m);const i=ss.indexOf(d);if(i>=0&&i<4)ev.push({t:'clean',sec:i+1});}
  return ev;
}

// 오늘 대청소 섹션 번호 (-1이면 오늘은 대청소 없음)
function getTodayCleanSec(){
  const d=today.getDate(),m=today.getMonth(),y=today.getFullYear();
  const dow=today.getDay();
  if(dow!==0)return -1;
  const ss=sundays(y,m);
  const i=ss.indexOf(d);
  return (i>=0&&i<4)?i+1:-1;
}

// 전날 날짜키
function prevDateKey(dateKey){
  const [yy,mm,dd]=dateKey.split('-').map(Number);
  const dt=new Date(yy,mm-1,dd);
  dt.setDate(dt.getDate()-1);
  return dk(dt.getFullYear(),dt.getMonth(),dt.getDate());
}

// 잠금 여부: 오늘=false, 어제=오늘 10시 이전이면 false / 이후면 true, 그 이전=항상 true
function isDateLocked(dateKey){
  const [yy,mm,dd]=dateKey.split('-').map(Number);
  const viewDate=new Date(yy,mm-1,dd);
  const todayDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const diffDays=Math.round((todayDate-viewDate)/86400000);
  if(diffDays<=0)return false;
  if(diffDays>=2)return true;
  return new Date().getHours()>=10;
}

// 해당 날짜의 청소 체크 항목 총 개수 (대청소일이면 기본+구역, 아니면 기본만)
function getCleanItemCount(y,m,d){
  const evs=getEvs(y,m,d);
  const cleanEv=evs.find(e=>e.t==='clean');
  return cleanEv?CLEAN_BASE.length+CSECTIONS[cleanEv.sec-1].items.length:CLEAN_BASE.length;
}

        if(done>=total&&total>0){
          el.className='store-today today-done';el.textContent=`✅ ${label} 완료`;

          el.className='store-today today-pending';el.textContent=`🟡 ${label} ${done}/${total}`;
        } else {
          el.className='store-today today-pending';el.textContent=`⬜ ${label} 0/${total}`;
        }

        const el=document.getElementById(statusId);
        if(el){el.className='store-today today-none';el.textContent='상태 확인 불가';}
      });

}

function renderCal(){
  const g=document.getElementById('grid');g.innerHTML='';
  const fd=new Date(cy,cm,1).getDay(),dim=new Date(cy,cm+1,0).getDate(),dp=new Date(cy,cm,0).getDate();
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('hsub').textContent=`${cy}년 ${mns[cm]}`;
  let cells=[];
  for(let i=fd-1;i>=0;i--)cells.push({d:dp-i,o:true,m:cm===0?11:cm-1,y:cm===0?cy-1:cy});
  for(let d=1;d<=dim;d++)cells.push({d,o:false,m:cm,y:cy});
  const rem=42-cells.length;
  for(let d=1;d<=rem;d++)cells.push({d,o:true,m:cm===11?0:cm+1,y:cm===11?cy+1:cy});
  cells.forEach(c=>{
    const div=document.createElement('div');div.className='day';
    const dow=new Date(c.y,c.m,c.d).getDay();
    if(c.o)div.classList.add('other-month');
    if(dow===0)div.classList.add('sun');
    if(dow===6)div.classList.add('sat');
    const isTod=!c.o&&c.y===today.getFullYear()&&c.m===today.getMonth()&&c.d===today.getDate();
    if(isTod)div.classList.add('today');
    if(sel&&!c.o&&sel.y===c.y&&sel.m===c.m&&sel.d===c.d)div.classList.add('selected');
    const nd=document.createElement('div');nd.className='day-num';nd.textContent=c.d;div.appendChild(nd);
    if(!c.o){
      const evs=getEvs(c.y,c.m,c.d);
      const bd=document.createElement('div');bd.className='badges';
      evs.forEach(e=>{
        const b=document.createElement('div');b.className='badge';
        if(e.t==='holiday'){b.className+=' b-red';b.textContent=e.label.slice(0,4);}
        else if(e.t==='order'){b.className+=' b-blue';b.textContent='전체주문';}
        else if(e.t==='stock'){b.className+=' b-orange';b.textContent='재고실사';}
        else if(e.t==='pod'){b.className+=' b-purple';b.textContent='팟점검';}
        else if(e.t==='aio'){b.className+=' b-purple';b.textContent='일체형점검';}
        else if(e.t==='report'){b.className+=' b-pink';b.textContent='보고마감';}
        else if(e.t==='as_deadline'){b.className+=' b-teal';b.textContent='AS접수마감';}
        else if(e.t==='as_send'){b.className+=' b-teal2';b.textContent='AS발송일';}
        else if(e.t==='clean'){b.className+=' b-green';b.textContent='대청소'+e.sec;}
        bd.appendChild(b);
      });
      div.appendChild(bd);
      div.onclick=()=>selDay(c.y,c.m,c.d);
    }
    g.appendChild(div);
  });
}

  const cleanTaskObj=cleanEv
    ? {task:`🧹 대청소 ${cleanEv.sec}구역`,meta:`기본 청소 6항목 + ${cleanEv.sec}구역 추가 청소`,col:"c-green",cleanTask:true,mode:'combined',secIdx:cleanEv.sec-1}
    : {task:"청소 및 매장 정리",meta:"기본 청소 6항목 체크리스트",col:"c-green",cleanTask:true,mode:'base',secIdx:null};
  [...specs,cleanTaskObj,...DAILY].forEach(t=>{
    const row=document.createElement('div');row.className='task';
    row.innerHTML=`<div class="task-dot ${t.col}"></div>
      <div style="flex:1"><div class="task-name">${t.task}</div>${t.meta?`<div class="task-meta">${t.meta}</div>`:''}</div>
      ${(t.cleanTask||t.report||t.asSend)?'<div class="task-expand">›</div>':''}`;
    if(t.cleanTask){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('cpanel');if(ex)ex.remove();
        if(open){row.insertAdjacentElement('afterend',buildCL(t.mode,t.secIdx,dk(y,m,d)));}
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    if(t.report){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('rpanel');if(ex)ex.remove();
        if(open){row.insertAdjacentElement('afterend',buildRP());}
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    if(t.asSend){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('aspanel');if(ex)ex.remove();
        if(open){row.insertAdjacentElement('afterend',buildAS(y,m));}
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    tl.appendChild(row);
  });

  // 오늘의 업무 섹션
  const todoContainer=document.getElementById('todo-container');
  todoContainer.innerHTML='';
  todoContainer.appendChild(buildTodoSection(y,m,d));

  det.style.display='block';
  setTimeout(()=>det.scrollIntoView({behavior:'smooth',block:'start'}),50);
}

// 오늘의 업무 (직원 자유 입력 + 이월)
// ══════════════════════════════════════
async function loadTodoItems(storeId,dateKey){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  let items=snap.exists()?(snap.data().items||[]):[];
  // 오늘 날짜를 볼 때만 전날 미완료 항목을 이월시켜 병합
  if(dateKey===todayKey()){
    const prevKey=prevDateKey(dateKey);
    try{
      const prevSnap=await getDoc(doc(db,`todos/${storeId}_${prevKey}`));
      if(prevSnap.exists()){
        const prevItems=prevSnap.data().items||[];
        const undone=prevItems.filter(it=>!it.done);
        let changed=false;
        undone.forEach(it=>{
          if(!items.find(x=>x.id===it.id)){
            items.push({...it,fromDate:it.fromDate||prevKey});
            changed=true;
          }
        });
        if(changed)await setDoc(ref,{items});
      }
    }catch(e){}
  }
  return items;
}

async function addTodoItem(storeId,dateKey,text,author){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];
  items.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,7),text,author,done:false,fromDate:null});
  await setDoc(ref,{items});
}

// 한 번에 여러 항목 추가 (각 줄 = 한 항목)
async function addTodoItems(storeId,dateKey,texts,author){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];
  texts.forEach(text=>{
    items.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+items.length,text,author,done:false,fromDate:null});
  });
  await setDoc(ref,{items});
}

async function toggleTodoItem(storeId,dateKey,itemId,doneVal){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];
  const item=items.find(x=>x.id===itemId);
  if(item)item.done=doneVal;
  await setDoc(ref,{items});
}

function buildTodoSection(y,m,d){
  const dateKey=dk(y,m,d);
  const locked=isDateLocked(dateKey);
  const wrap=document.createElement('div');wrap.className='todo-section';
  wrap.innerHTML=`<div class="todo-header">📝 오늘의 업무${locked?'<span class="lock-badge">🔒 마감됨</span>':''}</div>
    <div class="todo-list" id="todo-list-box">불러오는 중...</div>`;

  if(!locked){
    // 한 개씩 입력
    const inputRow=document.createElement('div');inputRow.className='todo-input-row';
    inputRow.innerHTML=`<input type="text" class="todo-input" placeholder="할 일을 입력하세요" id="todo-input-box">
      <button class="todo-add-btn" id="todo-add-box">+ 추가</button>`;
    wrap.appendChild(inputRow);

    // 여러 개 한번에 입력 (토글)
    const bulkToggle=document.createElement('button');bulkToggle.className='todo-bulk-toggle';bulkToggle.id='todo-bulk-toggle';
    bulkToggle.textContent='📋 여러 개 한번에 입력하기';
    wrap.appendChild(bulkToggle);

    const bulkWrap=document.createElement('div');bulkWrap.className='todo-bulk-wrap';bulkWrap.id='todo-bulk-wrap';bulkWrap.style.display='none';
    bulkWrap.innerHTML=`<textarea class="todo-bulk-textarea" id="todo-bulk-textarea" placeholder="한 줄에 하나씩 입력하세요${'\n'}예)${'\n'}재고 확인 요청${'\n'}창고 정리${'\n'}신제품 진열"></textarea>
      <div class="todo-bulk-btns">
        <button class="todo-add-btn" id="todo-bulk-submit">일괄 추가</button>
        <button class="reset-btn" id="todo-bulk-cancel">취소</button>
      </div>`;
    wrap.appendChild(bulkWrap);

    bulkToggle.onclick=()=>{
      const showing=bulkWrap.style.display!=='none';
      bulkWrap.style.display=showing?'none':'block';
      inputRow.style.display=showing?'flex':'none';
      bulkToggle.textContent=showing?'📋 여러 개 한번에 입력하기':'✏️ 한 개씩 입력하기';
      if(!showing)bulkWrap.querySelector('#todo-bulk-textarea').focus();
    };
    bulkWrap.querySelector('#todo-bulk-cancel').onclick=()=>{
      bulkWrap.querySelector('#todo-bulk-textarea').value='';
      bulkWrap.style.display='none';
      inputRow.style.display='flex';
      bulkToggle.textContent='📋 여러 개 한번에 입력하기';
    };
  }

  async function render(){
    const listEl=wrap.querySelector('#todo-list-box');
    if(!listEl)return;
    try{
      const items=await loadTodoItems(curStore.id,dateKey);
      if(items.length===0){
        listEl.innerHTML='<div class="todo-empty">등록된 업무가 없습니다</div>';
        return;
      }
      listEl.innerHTML='';
      items.forEach(item=>{
        const row=document.createElement('div');row.className='todo-item'+(item.done?' done':'');
        const carryTag=(item.fromDate&&item.fromDate!==dateKey)?`<span class="todo-carry">${item.fromDate.slice(5)}에서 이월</span>`:'';
        row.innerHTML=`<input type="checkbox" ${item.done?'checked':''} ${locked?'disabled':''}>
          <div class="todo-text-wrap"><span class="todo-text">${item.text}</span>${carryTag}<div class="todo-author">${item.author||'익명'}</div></div>`;
        if(!locked){
          row.querySelector('input').onchange=async(e)=>{
            try{
              await toggleTodoItem(curStore.id,dateKey,item.id,e.target.checked);
              row.className='todo-item'+(e.target.checked?' done':'');
            }catch(err){
              e.target.checked=!e.target.checked;
              alert('저장에 실패했습니다. 인터넷 연결을 확인해주세요.');
            }
          };
        }
        listEl.appendChild(row);
      });
    }catch(err){
      listEl.innerHTML='<div class="todo-error">⚠ 불러오기에 실패했습니다. 새로고침 후 다시 시도해주세요.</div>';
    }
  }
  render();

  if(!locked){
    const addBtn=wrap.querySelector('#todo-add-box');
    const input=wrap.querySelector('#todo-input-box');
    const doAdd=()=>{
      const text=input.value.trim();
      if(!text)return;
      ensureUsername(async(author)=>{
        addBtn.disabled=true;
        try{
          await addTodoItem(curStore.id,dateKey,text,author);
          input.value='';
          await render();
        }catch(err){
          alert('추가에 실패했습니다. 인터넷 연결을 확인해주세요.');
        }
        addBtn.disabled=false;
      });
    };
    addBtn.onclick=doAdd;
    input.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});

    // 일괄 추가
    const bulkSubmit=wrap.querySelector('#todo-bulk-submit');
    const bulkTextarea=wrap.querySelector('#todo-bulk-textarea');
    const bulkWrap=wrap.querySelector('#todo-bulk-wrap');
    const inputRow=wrap.querySelector('.todo-input-row');
    const bulkToggle=wrap.querySelector('#todo-bulk-toggle');
    bulkSubmit.onclick=()=>{
      const lines=bulkTextarea.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(lines.length===0)return;
      ensureUsername(async(author)=>{
        bulkSubmit.disabled=true;
        try{
          await addTodoItems(curStore.id,dateKey,lines,author);
          bulkTextarea.value='';
          bulkWrap.style.display='none';
          inputRow.style.display='flex';
          bulkToggle.textContent='📋 여러 개 한번에 입력하기';
          await render();
        }catch(err){
          alert('추가에 실패했습니다. 인터넷 연결을 확인해주세요.');
        }
        bulkSubmit.disabled=false;
      });
    };
  }

  return wrap;
}

// 대청소 체크리스트 (Firebase 연동)
// ══════════════════════════════════════
function buildCL(mode,secIdx,dateKey){
  const wrap=document.createElement('div');wrap.className='checklist-wrap';wrap.id='cpanel';
  const locked=isDateLocked(dateKey);
  const groups=[{title:'기본 청소',items:CLEAN_BASE}];
  if(mode==='combined')groups.push({title:CSECTIONS[secIdx].title,items:CSECTIONS[secIdx].items});
  const totalItems=groups.reduce((a,g)=>a+g.items.length,0);
  const syncEl=document.createElement('div');syncEl.className='sync-status';syncEl.textContent='';

  const docRef=doc(db,`checks/${curStore.id}/${dateKey}/clean`);

  let runningIdx=0;
  groups.forEach(g=>{
    const sd=document.createElement('div');sd.className='checklist-section';
    const tl=document.createElement('div');tl.className='section-title active-section';
    tl.textContent=g.title;sd.appendChild(tl);
    g.items.forEach(item=>{
      const idx=runningIdx++;
      const key=`item_${idx}`;
      const row=document.createElement('div');row.className='check-item';
      const cb=document.createElement('input');cb.type='checkbox';cb.id=`cb_clean_${idx}`;
      if(locked)cb.disabled=true;
      const lb=document.createElement('label');lb.htmlFor=`cb_clean_${idx}`;lb.textContent=item;
      cb.onchange=async()=>{
        syncEl.textContent='저장 중...';
        try{
          const snap=await getDoc(docRef);
          const cur=snap.exists()?snap.data():{};
          cur[key]=cb.checked;
          await setDoc(docRef,cur);
          syncEl.textContent='✓ 저장됨';
          setTimeout(()=>syncEl.textContent='',2000);
        }catch(e){syncEl.textContent='⚠ 저장 실패';}
        updateCount();
      };
      row.appendChild(cb);row.appendChild(lb);sd.appendChild(row);
    });
    wrap.appendChild(sd);
  });

  const ft=document.createElement('div');ft.className='checklist-footer';
  const ct=document.createElement('div');ct.className='check-count';ct.id='ccount';ct.textContent='불러오는 중...';
  ft.appendChild(ct);
  if(!locked){
    const rb=document.createElement('button');rb.className='reset-btn';rb.textContent='초기화';
    rb.onclick=async()=>{
      if(!confirm('체크 내용을 모두 초기화할까요?'))return;
      await setDoc(docRef,{});
      loadChecks();
    };
    ft.appendChild(rb);
  }
  wrap.appendChild(ft);
  wrap.appendChild(syncEl);

  function updateCount(){
    const cbs=wrap.querySelectorAll('input[type=checkbox]');
    const done=[...cbs].filter(c=>c.checked).length;
    ct.textContent=`${done} / ${totalItems} 완료`;
  }

  async function loadChecks(){
    try{
      const snap=await getDoc(docRef);
      const data=snap.exists()?snap.data():{};
      const cbs=wrap.querySelectorAll('input[type=checkbox]');
      cbs.forEach((cb,idx)=>{
        const key=`item_${idx}`;
        cb.checked=!!data[key];
      });
      updateCount();
    }catch(e){ct.textContent='불러오기 실패';}
  }
  loadChecks();

  if(locked){
    const lockMsg=document.createElement('div');lockMsg.className='todo-locked-msg';lockMsg.style.marginTop='10px';
    lockMsg.textContent='🔒 이 날짜는 마감되어 체크를 변경할 수 없습니다';
    wrap.appendChild(lockMsg);
  }

  // 직원용 피드백 읽기 박스
  const fbBox=document.createElement('div');fbBox.className='feedback-box';
  fbBox.innerHTML=`<div class="feedback-label">📋 관리자 피드백</div>
    <div class="feedback-content" id="fb-read-clean"><span class="feedback-empty">피드백 없음</span></div>`;
  wrap.appendChild(fbBox);

  // Firebase에서 피드백 실시간 로드
  const fbRef=doc(db,`feedback/${curStore.id}/${dateKey}/comment`);
  onSnapshot(fbRef,(snap)=>{
    const el=document.getElementById('fb-read-clean');
    if(!el)return;
    if(snap.exists()&&snap.data().text){
      el.innerHTML=`<span>${snap.data().text.replace(/\n/g,'<br>')}</span>
        <div style="font-size:10px;color:#bbb;margin-top:6px">${snap.data().updatedAt||''}</div>`;
    } else {
      el.innerHTML='<span class="feedback-empty">피드백 없음</span>';
    }
  });

  return wrap;
}

  content.appendChild(dateEl);

  for(const store of STORES){
    const card=document.createElement('div');card.className='dash-card';

    const nameDiv=document.createElement('div');nameDiv.className='dash-store-name';
    nameDiv.innerHTML=`${store.icon} ${store.name} <span class="dash-store-badge" id="badge-${store.id}"></span>`;
    card.appendChild(nameDiv);

    // 청소 진행률
    const pbWrap=document.createElement('div');pbWrap.className='progress-bar';
    const pbFill=document.createElement('div');pbFill.className='progress-fill';pbFill.style.width='0%';
    pbWrap.appendChild(pbFill);
    const statsEl=document.createElement('div');statsEl.className='dash-stats';
    statsEl.innerHTML=`<span id="stat-${store.id}">불러오는 중...</span><span>${cleanLabel}</span>`;
    card.appendChild(pbWrap);card.appendChild(statsEl);

    // 오늘의 업무 진행률
    const todoStats=document.createElement('div');todoStats.className='dash-todo-summary';
    todoStats.id=`todostat-${store.id}`;
    todoStats.textContent='📝 오늘의 업무 불러오는 중...';
    card.appendChild(todoStats);

    // 관리자 피드백 입력 영역
    const fbAdminWrap=document.createElement('div');fbAdminWrap.className='feedback-box';
    const fbSavedEl=document.createElement('div');fbSavedEl.className='feedback-saved';
    fbAdminWrap.innerHTML=`<div class="feedback-label">✏️ 피드백 작성</div>`;
    const fbTextarea=document.createElement('textarea');
    fbTextarea.className='feedback-textarea';
    fbTextarea.placeholder='직원들에게 전달할 피드백을 입력하세요...';
    fbTextarea.rows=3;
    const fbSaveBtn=document.createElement('button');
    fbSaveBtn.className='feedback-save-btn';
    fbSaveBtn.textContent='💾 저장하기';
    fbAdminWrap.appendChild(fbTextarea);
    fbAdminWrap.appendChild(fbSaveBtn);
    fbAdminWrap.appendChild(fbSavedEl);
    card.appendChild(fbAdminWrap);

    content.appendChild(card);

    // 기존 피드백 로드
    const fbRef=doc(db,`feedback/${store.id}/${tKey}/comment`);
    getDoc(fbRef).then(snap=>{
      if(snap.exists()&&snap.data().text){
        fbTextarea.value=snap.data().text;
      }
    });

    fbSaveBtn.onclick=async()=>{
      const text=fbTextarea.value.trim();
      fbSavedEl.textContent='저장 중...';
      try{
        const now=new Date();
        const ts=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        await setDoc(fbRef,{text,updatedAt:ts});
        fbSavedEl.textContent='✓ 저장됨';
        setTimeout(()=>fbSavedEl.textContent='',2000);
      }catch(e){fbSavedEl.textContent='⚠ 저장 실패';}
    };

    // 청소 실시간 리스닝
    const cleanRef=doc(db,`checks/${store.id}/${tKey}/clean`);
    const unsub1=onSnapshot(cleanRef,(snap)=>{
      const data=snap.exists()?snap.data():{};
      const done=Object.values(data).filter(Boolean).length;
      const pct=totalClean>0?Math.round(done/totalClean*100):0;
      pbFill.style.width=pct+'%';
      pbFill.className='progress-fill'+(done===0?' empty':done<totalClean?' warn':'');
      const statEl=document.getElementById(`stat-${store.id}`);
      if(statEl)statEl.textContent=`${done} / ${totalClean} 완료 (${pct}%)`;
      const badge=document.getElementById(`badge-${store.id}`);
      if(badge){
        if(done>=totalClean&&totalClean>0){badge.style.cssText='background:var(--green-light);color:var(--green)';badge.textContent='✅ 완료';}
        else if(done>0){badge.style.cssText='background:#fef3c7;color:#92400e';badge.textContent='🟡 진행중';}
        else{badge.style.cssText='background:#f3f4f6;color:#9ca3af';badge.textContent='⬜ 미완료';}
      }
    });
    dashUnsubs.push(unsub1);

    // 오늘의 업무 실시간 리스닝
    const todoRef=doc(db,`todos/${store.id}_${tKey}`);
    const unsub2=onSnapshot(todoRef,(snap)=>{
      const items=snap.exists()?(snap.data().items||[]):[];
      const done=items.filter(i=>i.done).length;
      const el=document.getElementById(`todostat-${store.id}`);
      if(el)el.textContent=`📝 오늘의 업무: ${done} / ${items.length} 완료`;
    });
    dashUnsubs.push(unsub2);
  }
}

// ── 탭 2: 일일 보고 (날짜 이동, 전날 기본값, 어제 10시 이후 잠금 확정) ──
async function renderReportTab(content){
  if(!dashViewDate){
    const yest=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);
    dashViewDate={y:yest.getFullYear(),m:yest.getMonth(),d:yest.getDate()};
  }
  const {y,m,d}=dashViewDate;
  const dateKey=dk(y,m,d);
  const dows=['일','월','화','수','목','금','토'];
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const dow=new Date(y,m,d).getDay();

  document.getElementById('dash-sub').textContent='지점별 일일 업무 보고';

  const nav=document.createElement('div');nav.className='dash-datenav';
  const todayDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const viewDate=new Date(y,m,d);
  const nextDate=new Date(y,m,d+1);
  const isYesterday=Math.round((todayDate-viewDate)/86400000)===1;
  nav.innerHTML=`<button id="rep-prev">‹</button>
    <span class="dash-datenav-label">${y}년 ${mns[m]} ${d}일 (${dows[dow]})${isYesterday?' · 어제':''}</span>
    <button id="rep-next" ${nextDate>=todayDate?'disabled':''}>›</button>`;
  content.appendChild(nav);
  nav.querySelector('#rep-prev').onclick=()=>{
    const nd=new Date(y,m,d-1);
    dashViewDate={y:nd.getFullYear(),m:nd.getMonth(),d:nd.getDate()};
    renderDashboard();
  };
  const nextBtn=nav.querySelector('#rep-next');
  if(!nextBtn.disabled){
    nextBtn.onclick=()=>{
      const nd=new Date(y,m,d+1);
      dashViewDate={y:nd.getFullYear(),m:nd.getMonth(),d:nd.getDate()};
      renderDashboard();
    };
  }

  if(isYesterday&&new Date().getHours()<10){
    const noticeEl=document.createElement('div');noticeEl.className='dash-date';
    noticeEl.textContent='⏰ 오전 10시 이후 전일 데이터가 최종 확정됩니다 (그 전까지는 직원이 수정 가능)';
    content.appendChild(noticeEl);
  }

  const totalClean=getCleanItemCount(y,m,d);
  const evs=getEvs(y,m,d);
  const cleanEv=evs.find(e=>e.t==='clean');
  const cleanLabel=cleanEv?`🧹 대청소 ${cleanEv.sec}구역`:'청소 및 매장 정리';

  for(const store of STORES){
    const card=document.createElement('div');card.className='dash-card';

    const cleanSnap=await getDoc(doc(db,`checks/${store.id}/${dateKey}/clean`));
    const cleanData=cleanSnap.exists()?cleanSnap.data():{};
    const cleanDone=Object.values(cleanData).filter(Boolean).length;

    const todoSnap=await getDoc(doc(db,`todos/${store.id}_${dateKey}`));
    const items=todoSnap.exists()?(todoSnap.data().items||[]):[];
    const todoDone=items.filter(i=>i.done).length;
    const authors=[...new Set(items.map(i=>i.author).filter(Boolean))];

    let html=`<div class="dash-store-name">${store.icon} ${store.name}</div>`;
    html+=`<div class="dash-workers">👤 근무자: ${authors.length?authors.join(', '):'기록 없음'}</div>`;
    html+=`<div class="dash-section-title">${cleanLabel}</div>`;
    const cleanIcon=(totalClean>0&&cleanDone>=totalClean)?'✅':(cleanDone>0?'🟡':'⬜');
    html+=`<div class="dash-stats" style="margin-bottom:4px"><span>${cleanDone} / ${totalClean} 완료</span><span>${cleanIcon}</span></div>`;
    html+=`<div class="dash-section-title">📝 오늘의 업무 (${todoDone}/${items.length})</div>`;
    if(items.length===0){
      html+=`<div class="no-clean">등록된 업무 없음</div>`;
    }else{
      html+=`<div class="dash-todo-list">`;
      items.forEach(it=>{
        const carry=(it.fromDate&&it.fromDate!==dateKey)?` <span style="color:var(--orange)">[${it.fromDate.slice(5)} 이월]</span>`:'';
        html+=`<div class="dash-todo-item${it.done?' done':''}"><span class="ico">${it.done?'✅':'⬜'}</span><span class="txt">${it.text} <span style="color:#bbb">(${it.author||'익명'})</span>${carry}</span></div>`;
      });
      html+=`</div>`;
    }
    card.innerHTML=html;
    content.appendChild(card);
  }
}

// ── 탭 3: 월간 통계 (이번 달 누적) ──
async function renderMonthlyTab(content){
  document.getElementById('dash-sub').textContent='이번 달 지점별 누적 통계';
  const y=today.getFullYear(),m=today.getMonth();
  const lastDay=Math.min(today.getDate()-1,new Date(y,m+1,0).getDate());
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  if(lastDay<1){
    content.innerHTML=`<div class="monthly-loading">아직 누적된 데이터가 없습니다 (월초)</div>`;
    return;
  }

  content.innerHTML=`<div class="monthly-loading">데이터 집계 중... (1~${lastDay}일)</div>`;

  const results=[];
  for(const store of STORES){
    let cleanDone=0,cleanTotal=0,todoDone=0,todoTotal=0;
    for(let d=1;d<=lastDay;d++){
      const dateKey=dk(y,m,d);
      cleanTotal+=getCleanItemCount(y,m,d);
      try{
        const cSnap=await getDoc(doc(db,`checks/${store.id}/${dateKey}/clean`));
        if(cSnap.exists())cleanDone+=Object.values(cSnap.data()).filter(Boolean).length;
      }catch(e){}
      try{
        const tSnap=await getDoc(doc(db,`todos/${store.id}_${dateKey}`));
        if(tSnap.exists()){
          const items=tSnap.data().items||[];
          todoTotal+=items.length;
          todoDone+=items.filter(i=>i.done).length;
        }
      }catch(e){}
    }
    results.push({store,cleanDone,cleanTotal,todoDone,todoTotal});
  }

  let html=`<div class="dash-date">${mns[m]} 1일 ~ ${lastDay}일 누적</div>`;
  html+=`<table class="monthly-table"><tr><th>지점</th><th>청소</th><th>오늘의 업무</th></tr>`;
  results.forEach(r=>{
    const cleanPct=r.cleanTotal>0?Math.round(r.cleanDone/r.cleanTotal*100):0;
    const todoPct=r.todoTotal>0?Math.round(r.todoDone/r.todoTotal*100):0;
    html+=`<tr><td>${r.store.icon} ${r.store.name}</td><td>${r.cleanDone}/${r.cleanTotal} (${cleanPct}%)</td><td>${r.todoTotal>0?`${r.todoDone}/${r.todoTotal} (${todoPct}%)`:'-'}</td></tr>`;
  });
  html+=`</table>`;
  content.innerHTML=html;
}

window.openPwModal=function(){
  document.getElementById('pw-modal').style.display='flex';
  document.getElementById('pw-input').value='';
  document.getElementById('pw-err').textContent='';
  setTimeout(()=>document.getElementById('pw-input').focus(),100);
};
window.closePwModal=function(){
  document.getElementById('pw-modal').style.display='none';
};
window.checkPw=function(){
  const val=document.getElementById('pw-input').value;
  if(val===ADMIN_PW){
    document.getElementById('pw-modal').style.display='none';
    isAdmin=true;
    dashTab='today';
    dashViewDate=null;
    showScreen('screen-admin');
    renderDashboard();
  } else {
    document.getElementById('pw-err').textContent='비밀번호가 틀렸습니다';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
};
document.getElementById('pw-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')window.checkPw();
});
document.getElementById('name-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')window.confirmName();
});
