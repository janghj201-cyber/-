<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>위베이프 일정표</title>
<meta name="theme-color" content="#0f7a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="위베이프 일정">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#1a2332;
  --navy-mid:#243044;
  --navy-light:#2d3d52;
  --gold:#f5a623;
  --gold-light:rgba(245,166,35,0.12);
  --bg:#f8f7f2;
  --card:#ffffff;
  --border:#e8e4dc;
  --text:#1a2332;
  --text-sub:#6b7a8d;
  --text-mute:#a0aab4;
  --green:#0f8a5f;--green-light:#e6f5ef;
  --blue:#1a5fb5;--blue-light:#e8f0fb;
  --orange:#d97706;--orange-light:#fef3e2;
  --purple:#6d3fa0;--purple-light:#f0eafb;
  --red:#c0392b;--red-light:#fdecea;
  --pink:#b5186a;--pink-light:#fce8f3;
  --teal:#0e7490;--teal-light:#e0f5f9;
  --white:var(--card);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-top:var(--safe-top);}

/* ── 공통 헤더 ── */
.header{background:var(--navy);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:17px;font-weight:700;color:#fff;}
.header-sub{font-size:11px;color:rgba(255,255,255,0.65);margin-top:1px;}
.nav-btns{display:flex;gap:6px;align-items:center;}
.nav-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;font-family:inherit;}
.nav-btn:active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.today-btn{font-size:12px;background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700;}
.back-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.admin-btn{background:rgba(245,166,35,0.2);border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;}

/* ── 화면 전환 ── */
.screen{display:none;}
.screen.active{display:block;}

/* ── 지점 선택 ── */
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;}
.store-card{background:var(--card);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(26,35,50,0.08);transition:transform 0.15s,box-shadow 0.15s;border:2px solid transparent;}
.store-card:active{transform:scale(0.97);}
.store-card:hover{box-shadow:0 4px 16px rgba(245,166,35,0.2);border-color:var(--gold);}
.store-icon{font-size:28px;margin-bottom:8px;}
.store-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;}
.store-area{font-size:11px;color:var(--text-sub);margin-top:3px;}
.store-today{margin-top:8px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block;}
.today-done{background:var(--green-light);color:var(--green);}
.today-pending{background:var(--orange-light);color:var(--orange);}
.today-none{background:#f0f0ee;color:var(--text-mute);}

/* ── 달력 ── */
.cal-wrap{background:var(--card);margin:12px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,35,50,0.08);border:1px solid var(--border);}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);background:#f2f0ea;}
.wd{text-align:center;font-size:11px;font-weight:600;padding:8px 0;color:var(--text-sub);}
.wd:first-child{color:var(--red);}
.wd:last-child{color:var(--blue);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day{min-height:62px;padding:5px 4px 4px;border-top:0.5px solid var(--border);cursor:pointer;transition:background 0.12s;}
.day:hover{background:#f5f3ee;}
.day.selected{background:var(--gold-light);border-color:var(--gold);}
.day.today .day-num{background:var(--gold);color:var(--navy);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 2px;font-weight:700;}
.day-num{font-size:13px;font-weight:500;text-align:center;margin-bottom:3px;line-height:1;color:var(--text);}
.day.other-month .day-num{color:var(--text-mute);}
.day.sun .day-num{color:var(--red);}
.day.sat .day-num{color:var(--blue);}
.day.today.sun .day-num,.day.today.sat .day-num{color:var(--navy);}
.badges{display:flex;flex-direction:column;gap:2px;}
.badge{font-size:9px;font-weight:600;border-radius:3px;padding:1px 3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.b-blue{background:#1a5fb5;color:#fff;}
.b-orange{background:#d97706;color:#fff;}
.b-purple{background:#6d3fa0;color:#fff;}
.b-red{background:#c0392b;color:#fff;}
.b-green{background:#0f8a5f;color:#fff;}
.b-pink{background:#b5186a;color:#fff;}
.b-teal{background:#0e7490;color:#fff;}
.b-teal2{background:#22d3ee;color:#0f1623;font-weight:700;}

/* ── 상세 패널 ── */
.detail{margin:0 12px 12px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,35,50,0.08);border:1px solid var(--border);}
.detail-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.detail-date{font-size:16px;font-weight:700;color:var(--text);}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.dtag{font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;}
.task-list{padding:8px 0;}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;cursor:pointer;}
.task:hover{background:#f8f7f2;}
.task-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.c-green{background:var(--green);}
.c-blue{background:var(--blue);}
.c-orange{background:var(--gold);}
.c-purple{background:var(--purple);}
.c-pink{background:var(--pink);}
.c-teal{background:var(--teal);}
.task-name{font-size:14px;font-weight:600;line-height:1.3;color:var(--text);}
.task-meta{font-size:12px;color:var(--text-sub);margin-top:2px;line-height:1.4;}
.task-expand{margin-left:auto;font-size:18px;color:var(--text-mute);flex-shrink:0;}

/* ── 체크리스트 ── */
.checklist-wrap{background:#f8f7f2;border-top:1px solid var(--border);padding:12px 16px;}
.checklist-section{margin-bottom:14px;}
.section-title{font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;padding:4px 8px;background:var(--green-light);border-radius:6px;display:inline-block;}
.section-title.active-section{background:var(--green);color:#fff;}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--border);}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin-top:1px;flex-shrink:0;cursor:pointer;}
.check-item label{font-size:13px;color:var(--text);line-height:1.4;cursor:pointer;}
.check-item input:checked+label{text-decoration:line-through;color:var(--text-mute);}
.checklist-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);margin-top:4px;}
.check-count{font-size:13px;font-weight:600;color:var(--navy);}
.reset-btn{font-size:12px;color:var(--text-sub);background:none;border:0.5px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;}
.sync-status{font-size:11px;color:var(--text-mute);margin-top:6px;text-align:right;}

/* ── 패널들 ── */
.report-wrap{background:#fff5f9;border-top:1px solid var(--border);padding:12px 16px;}
.report-title{font-size:13px;font-weight:700;color:var(--pink);margin-bottom:8px;}
.report-guide{font-size:12px;color:var(--text-sub);line-height:1.7;padding-left:0;}
.report-guide li{list-style:none;padding-left:14px;position:relative;margin-bottom:4px;}
.report-guide li::before{content:"·";position:absolute;left:0;color:var(--pink);}
.as-wrap{background:#e8f8fb;border-top:1px solid var(--border);padding:12px 16px;}
.as-title{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:8px;}
.as-guide{font-size:12px;color:var(--text-sub);line-height:1.7;padding-left:0;}
.as-guide li{list-style:none;padding-left:14px;position:relative;margin-bottom:4px;}
.as-guide li::before{content:"·";position:absolute;left:0;color:var(--teal);}

/* ── 관리자 피드백 ── */
.feedback-box{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.feedback-label{font-size:11px;font-weight:700;color:var(--text-sub);letter-spacing:0.5px;margin-bottom:6px;}
.feedback-content{font-size:13px;color:var(--text);line-height:1.6;background:#fffbf0;border-radius:8px;padding:10px 12px;border-left:3px solid var(--gold);min-height:40px;}
.feedback-empty{font-size:12px;color:var(--text-mute);font-style:italic;}
.feedback-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.6;min-height:80px;background:#fff;color:var(--text);}
.feedback-textarea:focus{border-color:var(--gold);}
.feedback-save-btn{margin-top:8px;width:100%;padding:10px;background:var(--gold);color:var(--navy);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.feedback-save-btn:active{opacity:0.85;}
.feedback-saved{font-size:11px;color:var(--green);margin-top:4px;text-align:right;min-height:16px;}

/* ── 범례 ── */
.legend{margin:0 12px 16px;background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(26,35,50,0.07);border:1px solid var(--border);}
.legend-title{font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:8px;letter-spacing:0.5px;}
.legend-items{display:flex;flex-wrap:wrap;gap:8px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-sub);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── 관리자 대시보드 ── */
.dash-wrap{padding:12px;}
.dash-date{font-size:13px;color:var(--text-sub);margin-bottom:12px;padding:0 4px;}
.dash-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(26,35,50,0.08);border:1px solid var(--border);}
.dash-store-name{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--text);}
.dash-store-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;}
.progress-bar{background:#f0eeea;border-radius:999px;height:10px;overflow:hidden;margin-bottom:6px;}
.progress-fill{height:100%;border-radius:999px;transition:width 0.5s ease;background:var(--gold);}
.progress-fill.warn{background:var(--orange);}
.progress-fill.empty{background:#e5e7eb;}
.dash-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);}
.dash-items{margin-top:10px;display:flex;flex-direction:column;gap:4px;}
.dash-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:0.5px solid var(--border);}
.dash-item:last-child{border-bottom:none;}
.dash-check{width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.dash-check.done{background:var(--gold);color:var(--navy);}
.dash-check.undone{background:#f0f0ee;color:#ccc;}
.dash-item-name{color:var(--text);}
.dash-item-name.done{text-decoration:line-through;color:var(--text-mute);}
.dash-toggle{display:block;width:100%;margin-top:10px;background:#f8f7f2;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;color:var(--text-sub);font-weight:600;cursor:pointer;font-family:inherit;}
.dash-detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.dash-detail.open{display:block;}
.dash-detail-title{font-size:11px;font-weight:700;color:var(--text-sub);margin:8px 0 4px;}
.no-clean{font-size:12px;color:var(--text-mute);padding:6px 0;}
.dash-refresh{display:block;margin:8px auto 0;background:none;border:0.5px solid var(--border);border-radius:8px;padding:6px 16px;font-size:12px;color:var(--text-sub);cursor:pointer;font-family:inherit;}

/* ── 오늘의 업무 ── */
.todo-section{border-top:1px solid var(--border);padding:14px 16px;background:#fafaf8;}
.todo-header{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;}
.lock-badge{font-size:10px;font-weight:600;background:#f0f0ee;color:var(--text-mute);padding:2px 8px;border-radius:10px;margin-left:6px;}
.todo-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.todo-empty{font-size:12px;color:var(--text-mute);padding:8px 0;text-align:center;}
.todo-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;box-shadow:0 1px 3px rgba(26,35,50,0.06);border:1px solid var(--border);}
.todo-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin-top:1px;flex-shrink:0;cursor:pointer;}
.todo-text-wrap{flex:1;}
.todo-text{font-size:13px;color:var(--text);line-height:1.4;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-mute);}
.todo-author{font-size:11px;color:var(--text-sub);margin-top:2px;}
.todo-carry{font-size:10px;color:var(--orange);background:var(--orange-light);padding:1px 6px;border-radius:8px;margin-left:6px;}
.todo-input-row{display:flex;gap:6px;}
.todo-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text);}
.todo-input:focus{border-color:var(--gold);}
.todo-add-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.todo-add-btn:active{background:var(--gold);color:var(--navy);}
.todo-locked-msg{font-size:12px;color:var(--text-sub);text-align:center;padding:8px;background:#f0f0ee;border-radius:8px;}
.todo-bulk-toggle{display:block;margin-top:6px;background:none;border:none;color:var(--gold);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:underline;padding:2px 0;}
.todo-bulk-wrap{margin-top:6px;}
.todo-bulk-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.6;min-height:90px;background:#fff;color:var(--text);}
.todo-bulk-textarea:focus{border-color:var(--gold);}
.todo-bulk-btns{display:flex;gap:6px;margin-top:6px;}
.todo-bulk-btns .todo-add-btn{flex:1;}
.todo-error{font-size:12px;color:var(--red);padding:8px 0;text-align:center;}
.todo-whoami{font-size:11px;color:var(--text-sub);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.todo-whoami b{color:var(--navy);font-weight:700;}
.todo-change-name{background:none;border:none;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0;}

/* 오늘의 업무 - 수정/삭제 */
.todo-actions{display:flex;gap:2px;flex-shrink:0;}
.todo-action-btn{background:none;border:none;font-size:14px;cursor:pointer;padding:2px 5px;color:var(--text-mute);border-radius:6px;}
.todo-action-btn:active{background:#f0f0ee;}
.todo-edit-row{display:flex;gap:6px;width:100%;align-items:center;}
.todo-edit-input{flex:1;border:1.5px solid var(--gold);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text);}
.todo-edit-btns{display:flex;gap:4px;flex-shrink:0;}
.todo-edit-btns button{font-size:12px;padding:6px 10px;border-radius:6px;border:none;font-family:inherit;cursor:pointer;}
.todo-edit-save{background:var(--gold);color:var(--navy);font-weight:700;}
.todo-edit-cancel{background:#f0f0ee;color:var(--text-sub);}

/* 인수인계 / 매장정보 */
.handover-section{border-top:1px solid var(--border);padding:14px 16px;background:#f8f7f2;}
.handover-header{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;}
.storeinfo-box{margin-bottom:14px;padding:12px;background:#fff;border-radius:10px;border:1px dashed var(--border);}
.storeinfo-label{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:6px;}
.storeinfo-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.6;min-height:70px;background:#fff;color:var(--text);}
.storeinfo-textarea:focus{border-color:var(--gold);}
.storeinfo-save-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.storeinfo-save-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.storeinfo-saved{font-size:11px;color:var(--green);}
.handover-sub{font-size:12px;font-weight:700;color:var(--text-sub);margin:4px 0 8px;}
.confirm-tag{font-size:10px;color:var(--green);background:var(--green-light);padding:1px 6px;border-radius:8px;margin-left:6px;}

/* ── 관리자 탭/날짜네비/월간통계 ── */
.dash-tabs{display:flex;gap:6px;padding:0 12px 12px;}
.dash-tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:#f0f0ee;color:var(--text-sub);}
.dash-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.dash-datenav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
.dash-datenav button{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;}
.dash-datenav button:disabled{opacity:0.3;cursor:default;}
.dash-datenav-label{font-size:13px;font-weight:700;color:var(--text);min-width:130px;text-align:center;}
.dash-section-title{font-size:12px;font-weight:700;color:var(--text-sub);margin:14px 0 6px 2px;}
.dash-workers{font-size:12px;color:var(--text-sub);margin-bottom:8px;}
.dash-todo-summary{font-size:12px;color:var(--text-sub);margin-top:6px;}
.dash-todo-list{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
.dash-todo-item{display:flex;align-items:flex-start;gap:6px;font-size:12px;padding:3px 0;}
.dash-todo-item .ico{flex-shrink:0;margin-top:1px;}
.dash-todo-item.done .txt{text-decoration:line-through;color:var(--text-mute);}
.monthly-table{width:100%;border-collapse:collapse;margin-top:8px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(26,35,50,0.08);border:1px solid var(--border);}
.monthly-table th,.monthly-table td{padding:10px 8px;font-size:12px;text-align:center;border-bottom:1px solid var(--border);color:var(--text);}
.monthly-table th{color:var(--text-sub);font-weight:600;background:#f8f7f2;}
.monthly-table td:first-child,.monthly-table th:first-child{text-align:left;}
.monthly-loading{text-align:center;font-size:12px;color:var(--text-sub);padding:30px 0;}

/* ── 비밀번호 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,35,50,0.6);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--card);border-radius:20px;padding:28px 24px;width:280px;text-align:center;box-shadow:0 8px 32px rgba(26,35,50,0.2);}
.modal h3{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--text);}
.modal p{font-size:13px;color:var(--text-sub);margin-bottom:16px;}
.modal input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:16px;text-align:center;letter-spacing:4px;font-family:inherit;outline:none;color:var(--text);}
.modal input:focus{border-color:var(--gold);}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.modal-btn.cancel{background:#f3f4f6;color:var(--text-sub);}
.modal-btn.confirm{background:var(--navy);color:#fff;}
.modal-err{font-size:12px;color:var(--red);margin-top:8px;min-height:16px;}

/* ── 설치 배너 ── */
.install-banner{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.5;}
.install-banner .ibtn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;white-space:nowrap;}
.install-banner .xbtn{margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;padding:0 2px;}
.pb{height:calc(20px + var(--safe-bot));}

/* ── 하단 탭 네비게이션 ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:2px solid var(--gold);display:flex;z-index:400;padding-bottom:var(--safe-bot);}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;border:none;background:none;font-family:inherit;color:rgba(255,255,255,0.45);transition:color 0.15s;}
.tab-item.active{color:var(--gold);}
.tab-icon{font-size:20px;margin-bottom:3px;}
.tab-label{font-size:10px;font-weight:600;}
.has-tab-bar{padding-bottom:calc(64px + var(--safe-bot));}

/* ── 대시보드 첫 화면 ── */
.notice-section{margin:12px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,35,50,0.08);border:1px solid var(--border);}
.notice-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;}
.notice-title{font-size:14px;font-weight:700;color:var(--text);}
.notice-admin-btn{background:var(--gold-light);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.notice-list{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;}
.notice-item{background:#f8f7f2;border-radius:10px;padding:10px 12px;border-left:3px solid var(--gold);}
.notice-item-title{font-size:13px;font-weight:700;color:var(--text);}
.notice-item-body{font-size:12px;color:var(--text-sub);margin-top:3px;line-height:1.5;}
.notice-item-meta{font-size:10px;color:var(--text-mute);margin-top:4px;}
.notice-empty{font-size:12px;color:var(--text-mute);text-align:center;padding:16px 0;}

.dashboard-today{margin:0 12px 12px;}
.dashboard-today-header{font-size:14px;font-weight:700;color:var(--text);padding:4px 2px 10px;}
.dashboard-store-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dashboard-store-block{background:var(--card);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 4px rgba(26,35,50,0.07);transition:border-color 0.15s,transform 0.12s;}
.dashboard-store-block:active{transform:scale(0.96);}
.dashboard-store-block.status-done{border-color:var(--green);}
.dashboard-store-block.status-pending{border-color:var(--orange);}
.dashboard-store-block.status-none{border-color:var(--border);}
.dashboard-store-block .store-icon{font-size:22px;margin-bottom:4px;}
.dashboard-store-block .store-name{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:4px;}
.dashboard-store-block .store-stats{font-size:10px;color:var(--text-sub);line-height:1.4;}
.dashboard-store-block .store-status-dot{width:8px;height:8px;border-radius:50%;margin:4px auto 0;}

/* ── 모달 공통 ── */
.notice-modal-bg{position:fixed;inset:0;background:rgba(26,35,50,0.6);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.notice-modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-bot));width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
.notice-modal h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);}
.notice-modal input,.notice-modal textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;margin-bottom:8px;color:var(--text);}
.notice-modal input:focus,.notice-modal textarea:focus{border-color:var(--gold);}
.notice-modal textarea{min-height:80px;resize:vertical;line-height:1.5;}
.notice-modal-btns{display:flex;gap:8px;margin-top:4px;}
.notice-modal-btns button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.notice-modal-btns .nm-confirm{background:var(--navy);color:#fff;}
.notice-modal-btns .nm-cancel{background:#f0f0ee;color:var(--text-sub);}
.notice-del-btn{background:none;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:2px 4px;float:right;}

/* ── 게시판 ── */
.board-section{margin:12px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,35,50,0.08);border:1px solid var(--border);}
.board-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;}
.board-title{font-size:14px;font-weight:700;color:var(--text);}
.board-write-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.board-tabs{display:flex;gap:0;padding:10px 16px 0;}
.board-tab{flex:1;padding:8px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text-mute);border-bottom:2px solid transparent;}
.board-tab.active{color:var(--navy);border-bottom:2px solid var(--gold);}
.board-list{padding:8px 0;}
.board-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.board-item:last-child{border-bottom:none;}
.board-item:active{background:#f8f7f2;}
.board-item-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.board-cat-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;}
.board-cat-notice{background:var(--orange-light);color:var(--orange);}
.board-cat-share{background:var(--blue-light);color:var(--blue);}
.board-item-title{font-size:13px;font-weight:700;color:var(--text);}
.board-item-preview{font-size:12px;color:var(--text-sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.board-item-meta{font-size:11px;color:var(--text-mute);margin-top:4px;}
.board-empty{font-size:12px;color:var(--text-mute);text-align:center;padding:20px 0;}

/* 게시글 상세 */
.board-detail-bg{position:fixed;inset:0;background:var(--bg);z-index:350;overflow-y:auto;display:none;padding-bottom:calc(64px + var(--safe-bot));}
.board-detail-bg.open{display:block;}
.board-detail-header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;}
.board-detail-body{padding:16px;}
.board-detail-cat{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;display:inline-block;margin-bottom:8px;}
.board-detail-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
.board-detail-meta{font-size:12px;color:var(--text-mute);margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.board-detail-content{font-size:14px;color:var(--text);line-height:1.7;white-space:pre-wrap;}
.board-detail-del{background:var(--card);border:1px solid var(--border);color:var(--text-sub);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;}

/* 게시글 작성 모달 */
.board-write-modal-bg{position:fixed;inset:0;background:rgba(26,35,50,0.6);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.board-write-modal-bg.open{display:flex;}
.board-write-modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-bot));width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.board-write-modal h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);}
.board-cat-select{display:flex;gap:8px;margin-bottom:12px;}
.board-cat-btn{flex:1;padding:9px;border-radius:10px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text-sub);}
.board-cat-btn.selected{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
.board-cat-btn.selected-notice{border-color:var(--gold);color:var(--orange);background:var(--orange-light);}
.board-write-modal input,.board-write-modal textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;margin-bottom:8px;color:var(--text);}
.board-write-modal input:focus,.board-write-modal textarea:focus{border-color:var(--gold);}
.board-write-modal textarea{min-height:100px;resize:vertical;line-height:1.5;}
.board-write-btns{display:flex;gap:8px;margin-top:4px;}
.board-write-btns button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.bw-confirm{background:var(--navy);color:#fff;}
.bw-cancel{background:#f0f0ee;color:var(--text-sub);}

/* ── 개인 페이지 ── */
.my-header-wrap{padding:16px 16px 0;}
.my-profile-card{background:var(--navy);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;}
.my-avatar{width:52px;height:52px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--navy);flex-shrink:0;}
.my-name{font-size:18px;font-weight:700;}
.my-name-sub{font-size:12px;opacity:0.7;margin-top:2px;}
.my-change-btn{margin-left:auto;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
.my-section{background:var(--card);border-radius:14px;margin:0 16px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(26,35,50,0.07);border:1px solid var(--border);}
.my-section-header{font-size:13px;font-weight:700;color:var(--text);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.my-date-nav{display:flex;align-items:center;gap:8px;}
.my-date-nav button{background:#f0f0ee;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer;color:var(--text);}
.my-date-label{font-size:12px;font-weight:600;color:var(--text-sub);min-width:80px;text-align:center;}
.my-todo-list{padding:8px 16px 12px;display:flex;flex-direction:column;gap:6px;}
.my-todo-item{display:flex;align-items:flex-start;gap:8px;background:#f8f7f2;border-radius:8px;padding:8px 10px;border:1px solid var(--border);}
.my-todo-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin-top:1px;flex-shrink:0;cursor:pointer;}
.my-todo-item.done .my-todo-text{text-decoration:line-through;color:var(--text-mute);}
.my-todo-text{font-size:13px;color:var(--text);line-height:1.4;flex:1;}
.my-todo-meta{font-size:10px;color:var(--text-mute);margin-top:2px;}
.my-todo-carry{font-size:10px;color:var(--orange);background:var(--orange-light);padding:1px 6px;border-radius:8px;margin-left:4px;}
.my-store-badge{font-size:10px;color:var(--text-sub);background:#f0f0ee;padding:1px 6px;border-radius:6px;margin-left:4px;}
.my-input-row{display:flex;gap:6px;padding:0 16px 12px;}
.my-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;}
.my-input:focus{border-color:var(--gold);}
.my-add-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.my-empty{font-size:12px;color:var(--text-mute);text-align:center;padding:16px;}
.my-store-select{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 12px;}
.my-store-chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-sub);font-family:inherit;}
.my-store-chip.active{border-color:var(--gold);background:var(--gold);color:var(--navy);}
.my-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px;}
.my-stat-box{background:#f8f7f2;border-radius:10px;padding:12px;text-align:center;}
.my-stat-num{font-size:22px;font-weight:700;color:var(--navy);}
.my-stat-label{font-size:10px;color:var(--text-sub);margin-top:2px;}
</style>
</head>
<body>

<!-- 설치 배너 -->
<div id="ibanner" class="install-banner" style="display:none">
  <span id="imsg"></span>
  <button class="ibtn" id="ibtn" style="display:none">홈 화면에 추가</button>
  <button class="xbtn" onclick="document.getElementById('ibanner').style.display='none'">×</button>
</div>

<!-- 비밀번호 모달 -->
<div class="modal-bg" id="pw-modal" style="display:none">
  <div class="modal">
    <h3>🔐 관리자 모드</h3>
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="pw-input" maxlength="20" placeholder="••••••">
    <div class="modal-err" id="pw-err"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePwModal()">취소</button>
      <button class="modal-btn confirm" onclick="checkPw()">확인</button>
    </div>
  </div>
</div>

<!-- 이름 입력 모달 -->
<div class="modal-bg" id="name-modal" style="display:none">
  <div class="modal">
    <h3>👤 이름 입력</h3>
    <p>업무 등록 시 표시될 이름을 입력해 주세요</p>
    <input type="text" id="name-input" maxlength="10" placeholder="예: 김민지" style="letter-spacing:normal;text-align:center;">
    <div class="modal-btns">
      <button class="modal-btn confirm" style="flex:1" onclick="confirmName()">확인</button>
    </div>
  </div>
</div>

<!-- 게시글 작성 모달 -->
<div class="board-write-modal-bg" id="board-write-modal" onclick="if(event.target===this)closeBoardWrite()">
  <div class="board-write-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h3 style="margin:0;">✏️ 글 작성</h3>
      <button onclick="closeBoardWrite()" style="background:none;border:none;font-size:22px;color:var(--text-mute);cursor:pointer;padding:0 4px;line-height:1;">×</button>
    </div>
    <div class="board-cat-select">
      <button class="board-cat-btn selected-notice selected" id="bcat-notice" onclick="selectBoardCat('notice')">📢 공지</button>
      <button class="board-cat-btn" id="bcat-share" onclick="selectBoardCat('share')">💬 업무공유</button>
    </div>
    <input type="text" id="board-title-input" placeholder="제목을 입력하세요">
    <textarea id="board-body-input" placeholder="내용을 입력하세요..."></textarea>
    <div class="board-write-btns">
      <button class="bw-cancel" onclick="closeBoardWrite()">취소</button>
      <button class="bw-confirm" onclick="submitBoardPost()">등록</button>
    </div>
  </div>
</div>

<!-- 게시글 상세 화면 -->
<div class="board-detail-bg" id="board-detail-screen">
  <div class="board-detail-header">
    <button class="back-btn" onclick="closeBoardDetail()">← 목록</button>
    <div style="font-size:14px;font-weight:700;">게시글</div>
    <button class="board-detail-del" id="board-detail-del-btn" style="display:none;background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;" onclick="deleteBoardPost()">삭제</button>
  </div>
  <div class="board-detail-body">
    <div class="board-detail-cat" id="board-detail-cat"></div>
    <div class="board-detail-title" id="board-detail-title"></div>
    <div class="board-detail-meta" id="board-detail-meta"></div>
    <div class="board-detail-content" id="board-detail-content"></div>
  </div>
</div>

<!-- ① 대시보드 화면 (첫 화면) -->
<div class="screen active has-tab-bar" id="screen-dashboard">
  <div class="header">
    <div><div class="header-title">📋 위베이프</div><div class="header-sub" id="dashboard-date-sub"></div></div>
    <button class="admin-btn" onclick="openPwModal()">🔐 관리자</button>
  </div>
  <!-- 게시판 -->
  <div class="board-section">
    <div class="board-header">
      <div class="board-title">📋 게시판</div>
      <button class="board-write-btn" onclick="openBoardWrite()">✏️ 글쓰기</button>
    </div>
    <div class="board-tabs">
      <button class="board-tab active" id="btab-all" onclick="switchBoardTab('all')">전체</button>
      <button class="board-tab" id="btab-notice" onclick="switchBoardTab('notice')">📢 공지</button>
      <button class="board-tab" id="btab-share" onclick="switchBoardTab('share')">💬 업무공유</button>
    </div>
    <div class="board-list" id="board-list"><div class="board-empty">불러오는 중...</div></div>
  </div>
  <!-- 오늘 전체 매장 현황 -->
  <div class="dashboard-today">
    <div class="dashboard-today-header">📍 오늘의 매장 현황</div>
    <div class="dashboard-store-grid" id="dashboard-store-list"></div>
  </div>
  <div class="pb"></div>
</div>

<!-- ② 월간 스케줄 화면 -->
<div class="screen has-tab-bar" id="screen-monthly">
  <div class="header">
    <div><div class="header-title" id="monthly-store-title">매장을 선택하세요</div><div class="header-sub" id="monthly-hsub"></div></div>
    <div class="nav-btns">
      <div id="monthly-store-selector" style="display:flex;gap:4px;align-items:center;">
        <button class="nav-btn" onclick="chgMonthlyStore(-1)">‹</button>
        <button class="nav-btn today-btn" onclick="openStoreSelect()">지점</button>
        <button class="nav-btn" onclick="chgMonthlyStore(1)">›</button>
      </div>
      <button class="nav-btn" onclick="chg(-1)">‹</button>
      <button class="nav-btn today-btn" onclick="goToday()">오늘</button>
      <button class="nav-btn" onclick="chg(1)">›</button>
    </div>
  </div>
  <div class="cal-wrap">
    <div class="weekday-row">
      <div class="wd">일</div><div class="wd">월</div><div class="wd">화</div>
      <div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd">토</div>
    </div>
    <div class="cal-grid" id="grid"></div>
  </div>
  <div class="detail" id="detail" style="display:none">
    <div class="detail-header">
      <div class="detail-date" id="ddate"></div>
      <div class="detail-tags" id="dtags"></div>
    </div>
    <div class="task-list" id="tlist"></div>
    <div id="todo-container"></div>
    <div id="handover-container"></div>
  </div>
  <div class="legend">
    <div class="legend-title">범례</div>
    <div class="legend-items">
      <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>전체주문(월)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>재고실사</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>기기점검</div>

function pad(n){return String(n).padStart(2,'0');}
function dk(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function todayKey(){return dk(today.getFullYear(),today.getMonth(),today.getDate());}
function sundays(y,m){let s=[],d=new Date(y,m,1);while(d.getMonth()===m){if(d.getDay()===0)s.push(d.getDate());d.setDate(d.getDate()+1);}return s;}

function getAsSendDate(y,m){
  let d=16;
  while(d>=1){
    const dow=new Date(y,m,d).getDay();
    const key=dk(y,m,d);
    if(dow!==0&&dow!==6&&!HOLIDAYS[key])return d;
    d--;
  }
  return 16;
}

function getEvs(y,m,d){
  const ev=[],dow=new Date(y,m,d).getDay(),key=dk(y,m,d);
  if(HOLIDAYS[key])ev.push({t:'holiday',label:HOLIDAYS[key]});
  if(dow===1)ev.push({t:'order'});
  if(d===1||d===2)ev.push({t:'stock'});
  if(d===8)ev.push({t:'pod'});
  if(d===22)ev.push({t:'aio'});
  if(d===25)ev.push({t:'report'});
  if(d===15)ev.push({t:'as_deadline'});
  if(d===getAsSendDate(y,m))ev.push({t:'as_send'});
  if(dow===0){const ss=sundays(y,m);const i=ss.indexOf(d);if(i>=0&&i<4)ev.push({t:'clean',sec:i+1});}
  return ev;
}

// 오늘 대청소 섹션 번호 (-1이면 오늘은 대청소 없음)
function getTodayCleanSec(){
  const d=today.getDate(),m=today.getMonth(),y=today.getFullYear();
  const dow=today.getDay();
  if(dow!==0)return -1;
  const ss=sundays(y,m);
  const i=ss.indexOf(d);
  return (i>=0&&i<4)?i+1:-1;
}

// 전날 날짜키
function prevDateKey(dateKey){
  const [yy,mm,dd]=dateKey.split('-').map(Number);
  const dt=new Date(yy,mm-1,dd);
  dt.setDate(dt.getDate()-1);
  return dk(dt.getFullYear(),dt.getMonth(),dt.getDate());
}

// 잠금 여부: 오늘=false, 어제=오늘 10시 이전이면 false / 이후면 true, 그 이전=항상 true
function isDateLocked(dateKey){
  const [yy,mm,dd]=dateKey.split('-').map(Number);
  const viewDate=new Date(yy,mm-1,dd);
  const todayDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const diffDays=Math.round((todayDate-viewDate)/86400000);
  if(diffDays<=0)return false; // 오늘 및 미래 = 잠금 없음
  if(diffDays>=2)return true;  // 그저께 이전 = 항상 잠금
  return new Date().getHours()>=10; // 어제 = 오전 10시 이후 잠금
}

// 해당 날짜의 청소 체크 항목 총 개수 (대청소일이면 기본+구역, 아니면 기본만)
function getCleanItemCount(y,m,d){
  const evs=getEvs(y,m,d);
  const cleanEv=evs.find(e=>e.t==='clean');
  return cleanEv?CLEAN_BASE.length+CSECTIONS[cleanEv.sec-1].items.length:CLEAN_BASE.length;
}

async function renderStoreGrid(){
  const grid=document.getElementById('store-grid');
  grid.innerHTML='';
  const ty=today.getFullYear(),tm=today.getMonth(),td=today.getDate();
  const sec=getTodayCleanSec();
  const tKey=todayKey();
  const total=getCleanItemCount(ty,tm,td);
  const label=sec>0?`대청소 ${sec}구역`:'청소 및 매장 정리';

  for(const store of STORES){
    const card=document.createElement('div');
    card.className='store-card';
    const statusId=`status-${store.id}`;
    card.innerHTML=`
      <div class="store-icon">${store.icon}</div>
      <div class="store-name">${store.name}</div>
      <div class="store-area">${store.area}</div>
      <span class="store-today today-none" id="${statusId}">확인중...</span>
    `;
    card.onclick=()=>{
      curStore=store;
      if(storeSelectCallback){storeSelectCallback(store);storeSelectCallback=null;}
      closeStoreSelect();
    };
    grid.appendChild(card);

    getDoc(doc(db,`checks/${store.id}/${tKey}/clean`))
      .then(snap=>{
        const data=snap.exists()?snap.data():{};
        const done=Object.values(data).filter(Boolean).length;
        const el=document.getElementById(statusId);
        if(!el)return;
        if(done>=total&&total>0){
          el.className='store-today today-done';el.textContent=`✅ ${label} 완료`;
        } else if(done>0){
          el.className='store-today today-pending';el.textContent=`🟡 ${label} ${done}/${total}`;
        } else {
          el.className='store-today today-pending';el.textContent=`⬜ ${label} 0/${total}`;
        }
      })
      .catch(()=>{
        const el=document.getElementById(statusId);
        if(el){el.className='store-today today-none';el.textContent='상태 확인 불가';}
      });
  }
}

    const block=document.createElement('div');
    block.className='dashboard-store-block status-none';

    let cleanDone=0,todoDone=0,todoTotal=0;
    try{
      const cs=await getDoc(doc(db,`checks/${store.id}/${tKey}/clean`));
      if(cs.exists())cleanDone=Object.values(cs.data()).filter(Boolean).length;
    }catch(e){}
    try{
      const ts=await getDoc(doc(db,`todos/${store.id}_${tKey}`));
      if(ts.exists()){const items=ts.data().items||[];todoTotal=items.length;todoDone=items.filter(i=>i.done).length;}
    }catch(e){}

    const cleanOk=total>0&&cleanDone>=total;
    const statusClass=cleanOk?'status-done':cleanDone>0?'status-pending':'status-none';
    const dotColor=cleanOk?'var(--green)':cleanDone>0?'var(--orange)':'var(--border)';
    block.className=`dashboard-store-block ${statusClass}`;

    // 매장명 줄임 처리
    const shortName=store.name.replace('인천 ','').replace('부천 ','').replace('구월 ','');

    block.innerHTML=`<div class="store-icon">${store.icon}</div>
      <div class="store-name">${shortName}</div>
      <div class="store-stats">${cleanLabel} ${cleanDone}/${total}</div>
      ${todoTotal>0?`<div class="store-stats">📝 ${todoDone}/${todoTotal}</div>`:''}
      <div class="store-status-dot" style="background:${dotColor}"></div>`;
    block.onclick=()=>{curStore=store;switchTab('monthly');};
    listEl.appendChild(block);
  }
}

let boardTab='all'; // 현재 게시판 탭
let boardWriteCat='notice'; // 작성 중인 카테고리
let boardViewPost=null; // 현재 보고 있는 게시글

async function loadBoard(){
  const listEl=document.getElementById('board-list');
  if(!listEl)return;
  listEl.innerHTML='<div class="board-empty">불러오는 중...</div>';
  try{
    const snap=await getDoc(doc(db,'board/posts'));
    const items=snap.exists()?(snap.data().items||[]):[];
    const filtered=boardTab==='all'?items:items.filter(i=>i.cat===boardTab);
    if(filtered.length===0){
      listEl.innerHTML='<div class="board-empty">게시글이 없습니다</div>';
      return;
    }
    listEl.innerHTML='';
    [...filtered].reverse().forEach((item,ri)=>{
      const realIdx=items.indexOf(item);
      const catLabel=item.cat==='notice'?'📢 공지':'💬 업무공유';
      const catClass=item.cat==='notice'?'board-cat-notice':'board-cat-share';
      const div=document.createElement('div');div.className='board-item';
      div.innerHTML=`<div class="board-item-top">
          <span class="board-cat-badge ${catClass}">${catLabel}</span>
        </div>
        <div class="board-item-title">${item.title}</div>
        <div class="board-item-preview">${item.body}</div>
        <div class="board-item-meta">${item.author||'익명'} · ${item.date||''}</div>`;
      div.onclick=()=>openBoardDetail(item,realIdx);
      listEl.appendChild(div);
    });
  }catch(e){
    listEl.innerHTML='<div class="board-empty">불러오기 실패</div>';
  }
}

window.switchBoardTab = function(tab){
  boardTab=tab;
  ['all','notice','share'].forEach(t=>{
    const btn=document.getElementById(`btab-${t}`);
    if(btn)btn.className='board-tab'+(t===tab?' active':'');
  });
  loadBoard();
}
function switchBoardTab(tab){window.switchBoardTab(tab);}

// 게시글 작성
window.openBoardWrite=function(){
  // 공지 카테고리는 관리자만
  boardWriteCat=isAdmin?'notice':'share';
  selectBoardCat(boardWriteCat);
  document.getElementById('board-title-input').value='';
  document.getElementById('board-body-input').value='';
  document.getElementById('board-write-modal').classList.add('open');
  setTimeout(()=>document.getElementById('board-title-input').focus(),100);
};
window.closeBoardWrite=function(){
  document.getElementById('board-write-modal').classList.remove('open');
};
window.selectBoardCat=function(cat){
  boardWriteCat=cat;
  const nb=document.getElementById('bcat-notice');
  const sb=document.getElementById('bcat-share');
  if(cat==='notice'){
    nb.className='board-cat-btn selected-notice selected';
    sb.className='board-cat-btn';
  } else {
    nb.className='board-cat-btn';
    sb.className='board-cat-btn selected';
  }
  // 공지는 관리자만 선택 가능
  if(cat==='notice'&&!isAdmin){
    alert('공지는 관리자만 작성할 수 있습니다');
    selectBoardCat('share');
  }
};
window.submitBoardPost=async function(){
  const title=document.getElementById('board-title-input').value.trim();
  const body=document.getElementById('board-body-input').value.trim();
  if(!title||!body){alert('제목과 내용을 입력해주세요');return;}
  const author=isAdmin?'관리자':(getUsername()||'익명');
  const ref=doc(db,'board/posts');
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];
  const now=new Date();
  const date=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  items.push({id:Date.now()+'',cat:boardWriteCat,title,body,author,date});
  await setDoc(ref,{items});
  closeBoardWrite();
  loadBoard();
};

// 게시글 상세
function openBoardDetail(item,idx){
  boardViewPost={item,idx};
  const catLabel=item.cat==='notice'?'📢 공지':'💬 업무공유';
  const catClass=item.cat==='notice'?'board-cat-notice':'board-cat-share';
  document.getElementById('board-detail-cat').textContent=catLabel;
  document.getElementById('board-detail-cat').className=`board-detail-cat ${catClass}`;
  document.getElementById('board-detail-title').textContent=item.title;
  document.getElementById('board-detail-meta').textContent=`${item.author||'익명'} · ${item.date||''}`;
  document.getElementById('board-detail-content').textContent=item.body;
  // 삭제 버튼: 관리자는 모두, 직원은 본인 글만
  const delBtn=document.getElementById('board-detail-del-btn');
  const canDel=isAdmin||(item.author===getUsername()&&item.cat!=='notice');
  delBtn.style.display=canDel?'block':'none';
  document.getElementById('board-detail-screen').classList.add('open');
}
window.closeBoardDetail=function(){
  document.getElementById('board-detail-screen').classList.remove('open');
};
window.deleteBoardPost=async function(){
  if(!boardViewPost||!confirm('이 게시글을 삭제할까요?'))return;
  const ref=doc(db,'board/posts');
  const snap=await getDoc(ref);
  let items=snap.exists()?(snap.data().items||[]):[];
  items.splice(boardViewPost.idx,1);
  await setDoc(ref,{items});
  closeBoardDetail();
  loadBoard();
};

function renderDailyScreen(){
  if(!curStore){curStore=STORES[0];}
  const ty=dailyDate.getFullYear(),tm=dailyDate.getMonth(),td=dailyDate.getDate();
  const dows=['일','월','화','수','목','금','토'];
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const isToday=(ty===today.getFullYear()&&tm===today.getMonth()&&td===today.getDate());

  // 헤더
  document.getElementById('daily-store-title').textContent=`${curStore.icon} ${curStore.name}`;
  document.getElementById('daily-date-sub').textContent=
    `${ty}년 ${mns[tm]} ${td}일 (${dows[new Date(ty,tm,td).getDay()]})${isToday?' · 오늘':''}`;

  // 작성자 이름 표시
  updateDailyUsername();
  const nameBtn=document.getElementById('daily-name-btn');
  if(nameBtn)nameBtn.onclick=()=>openNameModal(updateDailyUsername);

  // 날짜 네비 레이블
  const navLabel=document.getElementById('daily-nav-label');
  if(navLabel)navLabel.textContent=`${mns[tm]} ${td}일 (${dows[new Date(ty,tm,td).getDay()]})${isToday?' 오늘':''}`;

  // 다음날 버튼 — 오늘이면 비활성화
  const nextBtn=document.getElementById('daily-next-btn');
  if(nextBtn)nextBtn.disabled=isToday;

  const evs=getEvs(ty,tm,td);
  const dateKey=dk(ty,tm,td);

  // 날짜 헤더
  document.getElementById('daily-ddate').textContent=
    `${tm+1}월 ${td}일 (${dows[new Date(ty,tm,td).getDay()]})`;

  // 태그
  const tagsEl=document.getElementById('daily-dtags');
  tagsEl.innerHTML='';
  evs.forEach(e=>{
    if(SPECIALS[e.t]){
      const sp=SPECIALS[e.t];
      const t=document.createElement('span');t.className=`detail-tag ${sp.col}`;t.textContent=sp.task;tagsEl.appendChild(t);
    }
    if(e.t==='holiday'){const t=document.createElement('span');t.className='detail-tag c-red';t.textContent=e.name;tagsEl.appendChild(t);}
    if(e.t==='clean'){const t=document.createElement('span');t.className='detail-tag c-green';t.textContent=`🧹 대청소 ${e.sec}구역`;tagsEl.appendChild(t);}
  });

  // 업무 목록
  const tl=document.getElementById('daily-tlist');tl.innerHTML='';
  const cleanEv=evs.find(e=>e.t==='clean');
  const cleanTaskObj=cleanEv
    ?{task:`🧹 대청소 ${cleanEv.sec}구역`,meta:`기본 청소 6항목 + ${cleanEv.sec}구역 추가 청소`,col:"c-green",cleanTask:true,mode:'combined',secIdx:cleanEv.sec-1}
    :{task:"청소 및 매장 정리",meta:"기본 청소 6항목 체크리스트",col:"c-green",cleanTask:true,mode:'base',secIdx:null};
  const specs=[];
  evs.forEach(e=>{if(SPECIALS[e.t])specs.push({...SPECIALS[e.t]});});
  [...specs,cleanTaskObj,...DAILY].forEach(t=>{
    const row=document.createElement('div');row.className='task';
    row.innerHTML=`<div class="task-dot ${t.col}"></div>
      <div style="flex:1"><div class="task-name">${t.task}</div>${t.meta?`<div class="task-meta">${t.meta}</div>`:''}</div>
      ${t.cleanTask||t.report||t.asSend?'<div class="task-expand">›</div>':''}`;
    if(t.cleanTask){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('daily-cpanel');if(ex)ex.remove();
        if(open){
          const cl=buildCL(t.mode,t.secIdx,dateKey);
          cl.id='daily-cpanel';
          row.insertAdjacentElement('afterend',cl);
        }
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    tl.appendChild(row);
  });

  // 오늘의 업무 + 인수인계
  const todoContainer=document.getElementById('daily-todo-container');
  todoContainer.innerHTML='';
  todoContainer.appendChild(buildTodoSection(ty,tm,td));
  const handoverContainer=document.getElementById('daily-handover-container');
  handoverContainer.innerHTML='';
  handoverContainer.appendChild(buildHandoverSection(ty,tm,td));

  // 스크롤 상단
  window.scrollTo(0,0);
}

function renderCal(){
  const g=document.getElementById('grid');g.innerHTML='';
  const fd=new Date(cy,cm,1).getDay(),dim=new Date(cy,cm+1,0).getDate(),dp=new Date(cy,cm,0).getDate();
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('monthly-hsub').textContent=`${cy}년 ${mns[cm]}`;
  let cells=[];
  for(let i=fd-1;i>=0;i--)cells.push({d:dp-i,o:true,m:cm===0?11:cm-1,y:cm===0?cy-1:cy});
  for(let d=1;d<=dim;d++)cells.push({d,o:false,m:cm,y:cy});
  const rem=42-cells.length;
  for(let d=1;d<=rem;d++)cells.push({d,o:true,m:cm===11?0:cm+1,y:cm===11?cy+1:cy});
  cells.forEach(c=>{
    const div=document.createElement('div');div.className='day';
    const dow=new Date(c.y,c.m,c.d).getDay();
    if(c.o)div.classList.add('other-month');
    if(dow===0)div.classList.add('sun');
    if(dow===6)div.classList.add('sat');
    const isTod=!c.o&&c.y===today.getFullYear()&&c.m===today.getMonth()&&c.d===today.getDate();
    if(isTod)div.classList.add('today');
    if(sel&&!c.o&&sel.y===c.y&&sel.m===c.m&&sel.d===c.d)div.classList.add('selected');
    const nd=document.createElement('div');nd.className='day-num';nd.textContent=c.d;div.appendChild(nd);
    if(!c.o){
      const evs=getEvs(c.y,c.m,c.d);
      const bd=document.createElement('div');bd.className='badges';
      evs.forEach(e=>{
        const b=document.createElement('div');b.className='badge';
        if(e.t==='holiday'){b.className+=' b-red';b.textContent=e.label.slice(0,4);}
        else if(e.t==='order'){b.className+=' b-blue';b.textContent='전체주문';}
        else if(e.t==='stock'){b.className+=' b-orange';b.textContent='재고실사';}
        else if(e.t==='pod'){b.className+=' b-purple';b.textContent='팟점검';}
        else if(e.t==='aio'){b.className+=' b-purple';b.textContent='일체형점검';}
        else if(e.t==='report'){b.className+=' b-pink';b.textContent='보고마감';}
        else if(e.t==='as_deadline'){b.className+=' b-teal';b.textContent='AS접수마감';}
        else if(e.t==='as_send'){b.className+=' b-teal2';b.textContent='AS발송일';}
        else if(e.t==='clean'){b.className+=' b-green';b.textContent='대청소'+e.sec;}
        bd.appendChild(b);
      });
      div.appendChild(bd);
      div.onclick=()=>selDay(c.y,c.m,c.d);

      // 일일 업무 데이터 비동기 뱃지 (오늘 포함 과거 날짜만)
      const isPastOrToday=(new Date(c.y,c.m,c.d)<=new Date(today.getFullYear(),today.getMonth(),today.getDate()));
      if(isPastOrToday&&curStore){
        const dateKey=dk(c.y,c.m,c.d);
        getDoc(doc(db,`todos/${curStore.id}_${dateKey}`)).then(snap=>{
          if(!snap.exists())return;
          const items=snap.data().items||[];
          if(items.length===0)return;
          const done=items.filter(i=>i.done).length;
          const authors=[...new Set(items.map(i=>i.author).filter(Boolean))];
          const wb=document.createElement('div');wb.className='badge b-blue';
          wb.textContent=`📝${done}/${items.length}`;
          bd.appendChild(wb);
          if(authors.length>0){
            const ab=document.createElement('div');ab.className='badge';
            ab.style.cssText='background:#f0f0ee;color:#666;';
            ab.textContent=authors.slice(0,2).join(',')+(authors.length>2?'..':'');
            bd.appendChild(ab);
          }
        }).catch(()=>{});
      }
    }
    g.appendChild(div);
  });
}

function selDay(y,m,d){sel={y,m,d};renderCal();showDetail(y,m,d);}

function showDetail(y,m,d){
  const det=document.getElementById('detail');
  const dows=['일','월','화','수','목','금','토'];
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const dow=new Date(y,m,d).getDay();
  document.getElementById('ddate').textContent=`${y}년 ${mns[m]} ${d}일 (${dows[dow]})`;
  const evs=getEvs(y,m,d);
  const tg=document.getElementById('dtags');tg.innerHTML='';
  evs.forEach(e=>{
    const t=document.createElement('div');t.className='dtag';
    if(e.t==='holiday'){t.style.cssText='background:var(--red-light);color:var(--red)';t.textContent=e.label;}
    else if(e.t==='order'){t.style.cssText='background:var(--blue-light);color:var(--blue)';t.textContent='전체주문일';}
    else if(e.t==='stock'){t.style.cssText='background:var(--orange-light);color:var(--orange)';t.textContent='재고실사';}
    else if(e.t==='pod'){t.style.cssText='background:var(--purple-light);color:var(--purple)';t.textContent='팟형기기점검';}
    else if(e.t==='aio'){t.style.cssText='background:var(--purple-light);color:var(--purple)';t.textContent='일체형기기점검';}
    else if(e.t==='report'){t.style.cssText='background:var(--pink-light);color:var(--pink)';t.textContent='📊 월간보고 마감일';}
    else if(e.t==='as_deadline'){t.style.cssText='background:var(--teal-light);color:var(--teal)';t.textContent='📦 A/S 접수 마감일';}
    else if(e.t==='as_send'){t.style.cssText='background:var(--teal);color:#fff';t.textContent='🚚 A/S 발송일 (→로데오점)';}
    else if(e.t==='clean'){t.style.cssText='background:var(--green-light);color:var(--green)';t.textContent='대청소 구역 '+e.sec;}
    tg.appendChild(t);
  });
  // ① 오늘의 업무 (읽기 전용 — 입력은 일일 스케줄에서)
  const todoContainer=document.getElementById('todo-container');
  todoContainer.innerHTML='';
  todoContainer.appendChild(buildTodoSection(y,m,d,true));

  // ② 청소 체크리스트 + 기본 업무
  const tl=document.getElementById('tlist');tl.innerHTML='';
  const specs=[];
  evs.forEach(e=>{if(SPECIALS[e.t])specs.push({...SPECIALS[e.t]});});
  const cleanEv=evs.find(e=>e.t==='clean');
  const cleanTaskObj=cleanEv
    ? {task:`🧹 대청소 ${cleanEv.sec}구역`,meta:`기본 청소 6항목 + ${cleanEv.sec}구역 추가 청소`,col:"c-green",cleanTask:true,mode:'combined',secIdx:cleanEv.sec-1}
    : {task:"청소 및 매장 정리",meta:"기본 청소 6항목 체크리스트",col:"c-green",cleanTask:true,mode:'base',secIdx:null};
  [...specs,cleanTaskObj,...DAILY].forEach(t=>{
    const row=document.createElement('div');row.className='task';
    row.innerHTML=`<div class="task-dot ${t.col}"></div>
      <div style="flex:1"><div class="task-name">${t.task}</div>${t.meta?`<div class="task-meta">${t.meta}</div>`:''}</div>
      ${(t.cleanTask||t.report||t.asSend)?'<div class="task-expand">›</div>':''}`;
    if(t.cleanTask){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('cpanel');if(ex)ex.remove();
        if(open){row.insertAdjacentElement('afterend',buildCL(t.mode,t.secIdx,dk(y,m,d)));}
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    if(t.report){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('rpanel');if(ex)ex.remove();
        if(open){row.insertAdjacentElement('afterend',buildRP());}
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    if(t.asSend){
      let open=false;
      row.onclick=()=>{
        open=!open;
        const ex=document.getElementById('aspanel');if(ex)ex.remove();
        if(open){row.insertAdjacentElement('afterend',buildAS(y,m));}
        row.querySelector('.task-expand').textContent=open?'↓':'›';
      };
    }
    tl.appendChild(row);
  });

  // ③ 인수인계
  const handoverContainer=document.getElementById('handover-container');
  handoverContainer.innerHTML='';

// ══════════════════════════════════════
async function loadTodoItems(storeId,dateKey){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  let items=snap.exists()?(snap.data().items||[]):[];
  // 오늘 날짜를 볼 때만 전날 미완료 항목을 이월시켜 병합
  if(dateKey===todayKey()){
    const prevKey=prevDateKey(dateKey);
    try{
      const prevSnap=await getDoc(doc(db,`todos/${storeId}_${prevKey}`));
      if(prevSnap.exists()){
        const prevItems=prevSnap.data().items||[];
        const undone=prevItems.filter(it=>!it.done);
        let changed=false;
        undone.forEach(it=>{
          if(!items.find(x=>x.id===it.id)){
            items.push({...it,fromDate:it.fromDate||prevKey});
            changed=true;
          }
        });
        if(changed)await setDoc(ref,{items});
      }
    }catch(e){}
  }
  return items;
}

async function addTodoItem(storeId,dateKey,text,author){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];
  items.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,7),text,author,done:false,fromDate:null});
  await setDoc(ref,{items});
}

// 한 번에 여러 항목 추가 (각 줄 = 한 항목)
async function addTodoItems(storeId,dateKey,texts,author){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];
  texts.forEach(text=>{
    items.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+items.length,text,author,done:false,fromDate:null});
  });
  await setDoc(ref,{items});
}

async function toggleTodoItem(storeId,dateKey,itemId,doneVal){
  const ref=doc(db,`todos/${storeId}_${dateKey}`);
  const snap=await getDoc(ref);
  const items=snap.exists()?(snap.data().items||[]):[];

}

async function editTodoItem(storeId,dateKey,itemId,newText){

async function deleteTodoItem(storeId,dateKey,itemId){

}

function buildTodoSection(y,m,d,readOnly=false){

  const wrap=document.createElement('div');wrap.className='todo-section';

  if(!locked){
    // 현재 작성자 표시 + 변경
    const whoami=document.createElement('div');whoami.className='todo-whoami';
    const curName=getUsername();
    whoami.innerHTML=`작성자: <b id="todo-whoami-name">${curName||'(미설정)'}</b> <button class="todo-change-name" id="todo-change-name">변경</button>`;
    wrap.appendChild(whoami);
    whoami.querySelector('#todo-change-name').onclick=()=>{
      openNameModal((newName)=>{
        const nameEl=whoami.querySelector('#todo-whoami-name');
        if(nameEl)nameEl.textContent=newName;
      });
    };

    // 한 개씩 입력
    const inputRow=document.createElement('div');inputRow.className='todo-input-row';
    inputRow.innerHTML=`<input type="text" class="todo-input" placeholder="할 일을 입력하세요" id="todo-input-box">
      <button class="todo-add-btn" id="todo-add-box">+ 추가</button>`;
    wrap.appendChild(inputRow);

    // 여러 개 한번에 입력 (토글)
    const bulkToggle=document.createElement('button');bulkToggle.className='todo-bulk-toggle';bulkToggle.id='todo-bulk-toggle';
    bulkToggle.textContent='📋 여러 개 한번에 입력하기';
    wrap.appendChild(bulkToggle);

    const bulkWrap=document.createElement('div');bulkWrap.className='todo-bulk-wrap';bulkWrap.id='todo-bulk-wrap';bulkWrap.style.display='none';
    bulkWrap.innerHTML=`<textarea class="todo-bulk-textarea" id="todo-bulk-textarea" placeholder="한 줄에 하나씩 입력하세요${'\n'}예)${'\n'}재고 확인 요청${'\n'}창고 정리${'\n'}신제품 진열"></textarea>
      <div class="todo-bulk-btns">
        <button class="todo-add-btn" id="todo-bulk-submit">일괄 추가</button>
        <button class="reset-btn" id="todo-bulk-cancel">취소</button>
      </div>`;
    wrap.appendChild(bulkWrap);

    bulkToggle.onclick=()=>{
      const showing=bulkWrap.style.display!=='none';
      bulkWrap.style.display=showing?'none':'block';
      inputRow.style.display=showing?'flex':'none';
      bulkToggle.textContent=showing?'📋 여러 개 한번에 입력하기':'✏️ 한 개씩 입력하기';
      if(!showing)bulkWrap.querySelector('#todo-bulk-textarea').focus();
    };
    bulkWrap.querySelector('#todo-bulk-cancel').onclick=()=>{
      bulkWrap.querySelector('#todo-bulk-textarea').value='';
      bulkWrap.style.display='none';
      inputRow.style.display='flex';
      bulkToggle.textContent='📋 여러 개 한번에 입력하기';
    };
  }

  let editingId=null;

  async function render(){
    const listEl=wrap.querySelector('#todo-list-box');
    if(!listEl)return;
    try{
      const items=await loadTodoItems(curStore.id,dateKey);
      if(items.length===0){
        listEl.innerHTML='<div class="todo-empty">등록된 업무가 없습니다</div>';
        return;
      }
      listEl.innerHTML='';
      items.forEach(item=>{
        const row=document.createElement('div');row.className='todo-item'+(item.done?' done':'');

        if(!locked&&editingId===item.id){
          row.innerHTML=`<div class="todo-edit-row">
            <input type="text" class="todo-edit-input" id="edit-input-${item.id}">
            <div class="todo-edit-btns">
              <button class="todo-edit-save">저장</button>
              <button class="todo-edit-cancel">취소</button>
            </div>
          </div>`;
          const editInput=row.querySelector('.todo-edit-input');
          editInput.value=item.text;
          const doSave=async()=>{
            const newText=editInput.value.trim();
            if(!newText)return;
            try{
              await editTodoItem(curStore.id,dateKey,item.id,newText);
              editingId=null;
              await render();
            }catch(err){alert('수정에 실패했습니다. 인터넷 연결을 확인해주세요.');}
          };
          row.querySelector('.todo-edit-save').onclick=doSave;
          row.querySelector('.todo-edit-cancel').onclick=()=>{editingId=null;render();};
          editInput.addEventListener('keydown',e=>{if(e.key==='Enter')doSave();});
          listEl.appendChild(row);
          setTimeout(()=>editInput.focus(),0);
          return;
        }

        const carryTag=(item.fromDate&&item.fromDate!==dateKey)?`<span class="todo-carry">${item.fromDate.slice(5)}에서 이월</span>`:'';
        row.innerHTML=`<input type="checkbox" ${item.done?'checked':''} ${locked?'disabled':''}>
          <div class="todo-text-wrap"><span class="todo-text">${item.text}</span>${carryTag}<div class="todo-author">${item.author||'익명'}</div></div>
          ${!locked?`<div class="todo-actions">
            <button class="todo-action-btn" data-act="edit" title="수정">✏️</button>
            <button class="todo-action-btn" data-act="del" title="삭제">🗑️</button>
          </div>`:''}`;
        if(!locked){
          row.querySelector('input').onchange=async(e)=>{
            try{
              await toggleTodoItem(curStore.id,dateKey,item.id,e.target.checked);
              row.className='todo-item'+(e.target.checked?' done':'');
            }catch(err){
              e.target.checked=!e.target.checked;
              alert('저장에 실패했습니다. 인터넷 연결을 확인해주세요.');
            }
          };
          row.querySelector('[data-act="edit"]').onclick=()=>{editingId=item.id;render();};
          row.querySelector('[data-act="del"]').onclick=async()=>{
            if(!confirm('이 업무를 삭제할까요?'))return;
            try{
              await deleteTodoItem(curStore.id,dateKey,item.id);
              await render();
            }catch(err){alert('삭제에 실패했습니다. 인터넷 연결을 확인해주세요.');}
          };
        }
        listEl.appendChild(row);
      });
    }catch(err){
      listEl.innerHTML='<div class="todo-error">⚠ 불러오기에 실패했습니다. 새로고침 후 다시 시도해주세요.</div>';
    }
  }
  render();

  if(!locked){
    const addBtn=wrap.querySelector('#todo-add-box');
    const input=wrap.querySelector('#todo-input-box');
    const doAdd=()=>{
      const text=input.value.trim();
      if(!text)return;
      ensureUsername(async(author)=>{
        addBtn.disabled=true;
        try{
          await addTodoItem(curStore.id,dateKey,text,author);
          input.value='';
          await render();
        }catch(err){
          alert('추가에 실패했습니다. 인터넷 연결을 확인해주세요.');
        }
        addBtn.disabled=false;
      });
    };
    addBtn.onclick=doAdd;
    input.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});

    // 일괄 추가
    const bulkSubmit=wrap.querySelector('#todo-bulk-submit');
    const bulkTextarea=wrap.querySelector('#todo-bulk-textarea');
    const bulkWrap=wrap.querySelector('#todo-bulk-wrap');
    const inputRow=wrap.querySelector('.todo-input-row');
    const bulkToggle=wrap.querySelector('#todo-bulk-toggle');
    bulkSubmit.onclick=()=>{
      const lines=bulkTextarea.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(lines.length===0)return;
      ensureUsername(async(author)=>{
        bulkSubmit.disabled=true;
        try{
          await addTodoItems(curStore.id,dateKey,lines,author);
          bulkTextarea.value='';
          bulkWrap.style.display='none';
          inputRow.style.display='flex';
          bulkToggle.textContent='📋 여러 개 한번에 입력하기';
          await render();
        }catch(err){
          alert('추가에 실패했습니다. 인터넷 연결을 확인해주세요.');
        }
        bulkSubmit.disabled=false;
      });
    };
  }

  return wrap;
}

      });
    };
    addBtn.onclick=doAdd;
    input.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
  }

  return wrap;
}

// 대청소 체크리스트 (Firebase 연동)
// ══════════════════════════════════════
function buildCL(mode,secIdx,dateKey){
  const wrap=document.createElement('div');wrap.className='checklist-wrap';wrap.id='cpanel';
  const locked=isDateLocked(dateKey);
  const groups=[{title:'기본 청소',items:CLEAN_BASE}];
  if(mode==='combined')groups.push({title:CSECTIONS[secIdx].title,items:CSECTIONS[secIdx].items});
  const totalItems=groups.reduce((a,g)=>a+g.items.length,0);
  const syncEl=document.createElement('div');syncEl.className='sync-status';syncEl.textContent='';

  const docRef=doc(db,`checks/${curStore.id}/${dateKey}/clean`);

  let runningIdx=0;
  groups.forEach(g=>{
    const sd=document.createElement('div');sd.className='checklist-section';
    const tl=document.createElement('div');tl.className='section-title active-section';
    tl.textContent=g.title;sd.appendChild(tl);
    g.items.forEach(item=>{
      const idx=runningIdx++;
      const key=`item_${idx}`;
      const row=document.createElement('div');row.className='check-item';
      const cb=document.createElement('input');cb.type='checkbox';cb.id=`cb_clean_${idx}`;
      if(locked)cb.disabled=true;
      const lb=document.createElement('label');lb.htmlFor=`cb_clean_${idx}`;lb.textContent=item;
      cb.onchange=async()=>{
        syncEl.textContent='저장 중...';
        try{
          const snap=await getDoc(docRef);
          const cur=snap.exists()?snap.data():{};
          cur[key]=cb.checked;
          await setDoc(docRef,cur);
          syncEl.textContent='✓ 저장됨';
          setTimeout(()=>syncEl.textContent='',2000);
        }catch(e){syncEl.textContent='⚠ 저장 실패';}
        updateCount();
      };
      row.appendChild(cb);row.appendChild(lb);sd.appendChild(row);
    });
    wrap.appendChild(sd);
  });

  const ft=document.createElement('div');ft.className='checklist-footer';
  const ct=document.createElement('div');ct.className='check-count';ct.id='ccount';ct.textContent='불러오는 중...';
  ft.appendChild(ct);
  if(!locked){
    const rb=document.createElement('button');rb.className='reset-btn';rb.textContent='초기화';
    rb.onclick=async()=>{
      if(!confirm('체크 내용을 모두 초기화할까요?'))return;
      await setDoc(docRef,{});
      loadChecks();
    };
    ft.appendChild(rb);
  }
  wrap.appendChild(ft);
  wrap.appendChild(syncEl);

  function updateCount(){
    const cbs=wrap.querySelectorAll('input[type=checkbox]');
    const done=[...cbs].filter(c=>c.checked).length;
    ct.textContent=`${done} / ${totalItems} 완료`;
  }

  async function loadChecks(){
    try{
      const snap=await getDoc(docRef);
      const data=snap.exists()?snap.data():{};
      const cbs=wrap.querySelectorAll('input[type=checkbox]');
      cbs.forEach((cb,idx)=>{
        const key=`item_${idx}`;
        cb.checked=!!data[key];
      });
      updateCount();
    }catch(e){ct.textContent='불러오기 실패';}
  }
  loadChecks();

  if(locked){
    const lockMsg=document.createElement('div');lockMsg.className='todo-locked-msg';lockMsg.style.marginTop='10px';
    lockMsg.textContent='🔒 이 날짜는 마감되어 체크를 변경할 수 없습니다';
    wrap.appendChild(lockMsg);
  }

  // 직원용 피드백 읽기 박스
  const fbBox=document.createElement('div');fbBox.className='feedback-box';
  fbBox.innerHTML=`<div class="feedback-label">📋 관리자 피드백</div>
    <div class="feedback-content" id="fb-read-clean"><span class="feedback-empty">피드백 없음</span></div>`;
  wrap.appendChild(fbBox);

  // Firebase에서 피드백 실시간 로드
  const fbRef=doc(db,`feedback/${curStore.id}/${dateKey}/comment`);
  onSnapshot(fbRef,(snap)=>{
    const el=document.getElementById('fb-read-clean');
    if(!el)return;
    if(snap.exists()&&snap.data().text){
      el.innerHTML=`<span>${snap.data().text.replace(/\n/g,'<br>')}</span>
        <div style="font-size:10px;color:#bbb;margin-top:6px">${snap.data().updatedAt||''}</div>`;
    } else {
      el.innerHTML='<span class="feedback-empty">피드백 없음</span>';
    }
  });

  return wrap;
}

async function renderDashboard(){
  clearDashUnsubs();

  const tabs=document.createElement('div');tabs.className='dash-tabs';
  const tabDefs=[
    {id:'today',label:'📍 오늘 현황'},
    {id:'report',label:'📋 일일 보고'},

  ];
  tabDefs.forEach(td=>{
    const b=document.createElement('button');
    b.className='dash-tab'+(dashTab===td.id?' active':'');
    b.textContent=td.label;
    b.onclick=()=>{dashTab=td.id;renderDashboard();};
    tabs.appendChild(b);
  });

// ── 탭 1: 오늘 현황 (실시간) ──
async function renderTodayTab(content){
  const tKey=todayKey();

  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('dash-sub').textContent=
    `${today.getFullYear()}년 ${mns[today.getMonth()]} ${today.getDate()}일 (${dows[today.getDay()]}) · 실시간`;

  const totalClean=getCleanItemCount(today.getFullYear(),today.getMonth(),today.getDate());
  const evs=getEvs(today.getFullYear(),today.getMonth(),today.getDate());
  const cleanEv=evs.find(e=>e.t==='clean');
  const cleanLabel=cleanEv?`🧹 대청소 ${cleanEv.sec}구역 (기본+구역)`:'청소 및 매장 정리 (기본 6항목)';
