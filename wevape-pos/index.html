<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>위베이프 통합 프로그램</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; margin: 0; background: #f4f4f2; color: #1a1a1a; }
  input, select, button { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #1a1a1a; color: #fff; border: none; cursor: pointer; }
  button:hover { opacity: 0.85; }
  button.secondary { background: #fff; color: #1a1a1a; border: 1px solid #ccc; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #e5e5e0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: #777; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }

  #loginView { max-width: 360px; margin: 80px auto; padding: 0 16px; }
  #loginView h1 { font-size: 20px; margin-bottom: 24px; }
  #loginView input { width: 100%; margin-bottom: 10px; }
  #loginView button { width: 100%; padding: 10px; }
  #loginError { color: #c0392b; font-size: 13px; margin-top: 8px; }

  #appView { display: none; }
  header { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  header .brand { font-weight: 700; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e5e5e0; }
  nav button { white-space: nowrap; background: #fff; color: #555; border: 1px solid transparent; }
  nav button.active { background: #1a1a1a; color: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .cartRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .resultRow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .resultRow:hover { background: #fafaf8; }
</style>
</head>
<body>

<div id="loginView">
  <h1>위베이프 통합 프로그램</h1>
  <input id="loginEmail" type="email" placeholder="이메일" />
  <input id="loginPassword" type="password" placeholder="비밀번호" />
  <button id="loginBtn">로그인</button>
  <div id="loginError"></div>
</div>

<div id="appView">
  <header>
    <span class="brand">위베이프 POS</span>
    <button class="secondary" id="logoutBtn">로그아웃</button>
  </header>
  <nav id="navBar">
    <button data-tab="orders" class="active">주문입력</button>
    <button data-tab="purchases">입고</button>
    <button data-tab="transfer">이동/조정</button>
    <button data-tab="refund">환불</button>
    <button data-tab="closing">마감</button>
    <button data-tab="customers">고객조회</button>
    <button data-tab="dashboard">대시보드</button>
  </nav>
  <main>
    <div id="panel-orders" class="panel active"></div>
    <div id="panel-purchases" class="panel"></div>
    <div id="panel-transfer" class="panel"></div>
    <div id="panel-refund" class="panel"></div>
    <div id="panel-closing" class="panel"></div>
    <div id="panel-customers" class="panel"></div>
    <div id="panel-dashboard" class="panel"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/purchases.js"></script>
<script src="js/transfer.js"></script>
<script src="js/refund.js"></script>
<script src="js/closing.js"></script>
<script src="js/customers.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
