<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 — V-Flow</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-v2.png">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7f2;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
  h2{margin:0 0 8px;color:#1a2332;}
  p{color:#6b7a8d;font-size:14px;margin:0 0 20px;}
  label{display:block;font-size:13px;color:#1a2332;margin-bottom:6px;margin-top:14px;}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e8e4dc;border-radius:8px;font-size:14px;}
  button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:8px;background:#1a2332;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:0.6;cursor:default;}
  .error{color:#c0392b;font-size:13px;margin-top:10px;}
  .ok{color:#0f766e;font-size:14px;margin-top:10px;}
  a{color:#f5a623;font-weight:700;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <h2>비밀번호 재설정</h2>
    <p id="lead">새로 사용할 비밀번호를 입력하세요.</p>
    <form id="reset-form">
      <label>새 비밀번호<input type="password" id="pw1" required minlength="6" placeholder="6자 이상" /></label>
      <label>새 비밀번호 확인<input type="password" id="pw2" required minlength="6" /></label>
      <p class="error" id="error" hidden></p>
      <p class="ok" id="okmsg" hidden></p>
      <button type="submit" id="submitBtn">비밀번호 변경</button>
    </form>
    <p style="text-align:center;margin:16px 0 0;font-size:13px;color:#6b7a8d;"><a href="login.html">로그인 화면으로</a></p>
  </div>

  <script type="module">
    import { supabase } from './adapter/supabase-client.js'
    const errorEl = document.getElementById('error')
    const okEl = document.getElementById('okmsg')
    const submitBtn = document.getElementById('submitBtn')
    const lead = document.getElementById('lead')

    // 이메일 링크로 들어오면 supabase가 URL의 복구 토큰을 자동 인식해 임시 세션을 만든다.
    // 잠깐 기다렸다가 세션이 없으면 "링크가 만료됐거나 잘못된 접근"으로 안내.
    let hasRecovery = false
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') hasRecovery = true
    })
    await new Promise(r => setTimeout(r, 800))
    const { data: { session } } = await supabase.auth.getSession()
    if (!session && !hasRecovery) {
      lead.textContent = '이 링크는 만료되었거나 유효하지 않습니다. 로그인 화면에서 다시 시도해 주세요.'
      document.getElementById('reset-form').style.display = 'none'
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.hidden = true; okEl.hidden = true
      const p1 = document.getElementById('pw1').value
      const p2 = document.getElementById('pw2').value
      if (p1 !== p2) { errorEl.textContent = '두 비밀번호가 서로 다릅니다.'; errorEl.hidden = false; return }
      submitBtn.disabled = true; submitBtn.textContent = '변경 중...'
      try {
        const { error } = await supabase.auth.updateUser({ password: p1 })
        if (error) throw error
        okEl.textContent = '✓ 비밀번호가 변경되었습니다. 잠시 후 로그인 화면으로 이동합니다.'
        okEl.hidden = false
        document.getElementById('reset-form').querySelectorAll('input,button').forEach(el => el.disabled = true)
        setTimeout(() => { location.href = 'login.html' }, 2000)
      } catch (err) {
        errorEl.textContent = err.message || '변경에 실패했습니다.'
        errorEl.hidden = false
        submitBtn.disabled = false; submitBtn.textContent = '비밀번호 변경'
      }
    })
  </script>
</body>
</html>
