<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 — Dutyvo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/dutyvo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/dutyvo-192.png">
<link rel="stylesheet" href="lp/dv-auth.css?v=1">
</head>
<body>
  <main class="shell narrow">
    <a class="brand" href="/intro"><img src="icons/dutyvo-mark.svg" alt="">Dutyvo</a>
    <section class="card">
      <h1>비밀번호 재설정</h1>
      <p class="sub" id="lead">새로 쓸 비밀번호를 적어 주세요.</p>
      <form id="reset-form">
        <label class="f">새 비밀번호<input type="password" id="pw1" required minlength="6" placeholder="6자 이상" autocomplete="new-password" /></label>
        <label class="f">새 비밀번호 확인<input type="password" id="pw2" required minlength="6" autocomplete="new-password" /></label>
        <p class="err" id="error" hidden></p>
        <p class="okmsg" id="okmsg" hidden></p>
        <div class="acts"><button type="submit" class="btn main" id="submitBtn">비밀번호 변경</button></div>
      </form>
      <span class="link"><a href="login.html">로그인 화면으로</a></span>
    </section>
  </main>

  <script type="module">
    import { supabase } from './adapter/supabase-client.js'
    const errorEl = document.getElementById('error')
    const okEl = document.getElementById('okmsg')
    const submitBtn = document.getElementById('submitBtn')
    const lead = document.getElementById('lead')

    // 이메일 링크로 들어오면 supabase가 URL의 복구 토큰을 자동 인식해 임시 세션을 만든다.
    // 잠깐 기다렸다가 세션이 없으면 "링크가 만료됐거나 잘못된 접근"으로 안내.
    let hasRecovery = false
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') hasRecovery = true
    })
    await new Promise(r => setTimeout(r, 800))
    const { data: { session } } = await supabase.auth.getSession()
    if (!session && !hasRecovery) {
      lead.textContent = '이 링크는 만료되었거나 유효하지 않습니다. 로그인 화면에서 다시 시도해 주세요.'
      document.getElementById('reset-form').style.display = 'none'
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.hidden = true; okEl.hidden = true
      const p1 = document.getElementById('pw1').value
      const p2 = document.getElementById('pw2').value
      if (p1 !== p2) { errorEl.textContent = '두 비밀번호가 서로 다릅니다.'; errorEl.hidden = false; return }
      submitBtn.disabled = true; submitBtn.textContent = '변경 중...'
      try {
        const { error } = await supabase.auth.updateUser({ password: p1 })
        if (error) throw error
        okEl.textContent = '비밀번호를 바꿨습니다. 잠시 후 로그인 화면으로 갑니다.'
        okEl.hidden = false
        document.getElementById('reset-form').querySelectorAll('input,button').forEach(el => el.disabled = true)
        setTimeout(() => { location.href = 'login.html' }, 2000)
      } catch (err) {
        errorEl.textContent = err.message || '변경에 실패했습니다.'
        errorEl.hidden = false
        submitBtn.disabled = false; submitBtn.textContent = '비밀번호 변경'
      }
    })
  </script>
</body>
</html>
