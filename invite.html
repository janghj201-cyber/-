<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>초대 수락 — Dutyvo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/dutyvo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/dutyvo-192.png">
<link rel="stylesheet" href="lp/dv-auth.css?v=1">
</head>
<body>
  <main class="shell narrow">
    <a class="brand" href="/intro"><img src="icons/dutyvo-mark.svg" alt="">Dutyvo</a>
    <section class="card">
      <h1>초대를 받았습니다</h1>
      <p class="sub" id="sub">초대받은 이메일로 비밀번호만 정하면 바로 팀에 합류합니다.</p>
      <form id="form">
        <label class="f">이메일<input type="email" id="email" required placeholder="초대받은 이메일" autocomplete="email" /></label>
        <label class="f">비밀번호<input type="password" id="password" required minlength="6" placeholder="6자 이상" autocomplete="new-password" /></label>
        <div id="inv-consent"></div>
        <p class="err" id="error" hidden></p>
        <div class="acts"><button type="submit" class="btn main" id="btn" disabled>가입하고 합류하기</button></div>
      </form>
      <span class="link" id="toggle-wrap">이미 계정이 있으면 <a href="#" id="toggle">로그인으로 합류</a></span>
    </section>
  </main>

  <script type="module">
    import { supabase } from './adapter/supabase-client.js'
    import { renderConsentBox, saveConsents, STAFF_KEYS } from './consent.js'
    const $ = (id) => document.getElementById(id)
    { const _b=$('btn'); window.__invConsent = renderConsentBox($('inv-consent'), STAFF_KEYS, (ok) => { _b.disabled = !ok }, { cls: true }) }
    const inviteId = new URLSearchParams(location.search).get('id')
    if (!inviteId) { $('sub').textContent='초대 링크가 올바르지 않아요. 관리자에게 링크를 다시 받아주세요.'; $('form').style.display='none'; $('toggle-wrap').style.display='none' }

    let mode = 'signup'
    $('toggle').onclick = (e) => {
      e.preventDefault()
      mode = mode==='signup' ? 'login' : 'signup'
      $('btn').textContent = mode==='signup' ? '가입하고 합류하기' : '로그인하고 합류하기'
      $('toggle').textContent = mode==='signup' ? '로그인으로 합류' : '가입으로 합류'
    }

    async function acceptFlow() {
      // 로그인된 본인 이메일 기준으로 초대 조회(RLS: 본인 이메일 초대만 보임)
      const { data: inv, error } = await supabase.from('invitations').select('*').eq('id', inviteId).maybeSingle()
      if (error) throw error
      if (!inv) throw new Error('이 계정 이메일로 온 초대가 아니에요. 초대받은 이메일로 로그인해 주세요.')
      if (inv.status !== 'pending') throw new Error('이미 사용됐거나 만료된 초대예요.')
      const { data: { user } } = await supabase.auth.getUser()
      // 프로필 생성(초대 조건과 일치해야 RLS 통과) + 초대 수락 처리
      const { error: pErr } = await supabase.from('profiles').insert({ id: user.id, tenant_id: inv.tenant_id, store_id: inv.store_id, name: inv.name, role: inv.role, monitor_only: inv.monitor_only ?? false })
      if (pErr && !String(pErr.message).includes('duplicate')) throw pErr
      const { error: uErr } = await supabase.from('invitations').update({ status: 'accepted' }).eq('id', inv.id)
      if (uErr) throw uErr
      try { await saveConsents(inv.tenant_id, user.id, 'staff', window.__invConsent ? window.__invConsent.values() : { staff_privacy: true, privacy: true, staff_insights: false }) } catch (ce) { console.warn('[consent]', ce) }
    }

    // 이미 로그인된 상태로 링크를 열었으면 바로 수락 시도
    const { data: { session } } = await supabase.auth.getSession()
    if (session && inviteId) {
      const { data: prof } = await supabase.from('profiles').select('id').eq('id', session.user.id).maybeSingle()
      if (prof) { location.href='index.html' }
      else {
        try { await acceptFlow(); location.href='index.html' } catch(e){ $('error').textContent=e.message; $('error').hidden=false }
      }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn=$('btn'), err=$('error'); err.hidden=true; btn.disabled=true; btn.textContent='처리 중...'
      try {
        const email=$('email').value.trim(), password=$('password').value
        if (mode==='signup') {
          const { data, error } = await supabase.auth.signUp({ email, password })
          if (error) throw error
          if (!data.session) { err.textContent='가입 확인 메일이 발송됐어요. 메일 링크 확인 후 이 초대 링크를 다시 열어주세요.'; err.hidden=false; btn.disabled=false; btn.textContent='가입하고 합류하기'; return }
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password })
          if (error) throw error
        }
        await acceptFlow()
        location.href='index.html'
      } catch (e2) {
        err.textContent = e2.message || '합류에 실패했습니다.'; err.hidden=false; btn.disabled=false
        btn.textContent = mode==='signup' ? '가입하고 합류하기' : '로그인하고 합류하기'
      }
    })
  </script>
</body>
</html>
