<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dutyvo 운영</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/dutyvo-32.png">
<style>
/* 관리자 사이트 /ops(v6.38) — 앱과 같은 색 이름(ops.js 화면을 그대로 열기 때문) */
:root{--navy:#172233;--gold:#d6a246;--bg:#f7f5f0;--card:#fff;--border:#dcd7cc;--text:#182231;--text-sub:#5b6778;--text-mute:#66717f;
 --green:#24785d;--green-light:#e6f1ec;--blue:#2f5f9e;--orange:#a9650c;--orange-light:#f9efe0;--red:#bd453d;--red-light:#f8e9e7;--soft:#f2f0eb;--mint:#e3f2ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button{font-family:inherit}
.header{background:var(--navy);color:#fff;padding:13px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:17px;font-weight:800}.header-sub{font-size:13px;color:rgba(255,255,255,.65)}
.back-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.s{min-height:26px;font-size:12px;padding:0 9px}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn:disabled{opacity:.5}
.gate{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center}
.gate b{font-size:17px}.gate p{color:var(--text-sub);font-size:14px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--navy) 210px,transparent 210px)}
.row .btn{min-height:32px}
.nav{background:var(--navy);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.nav .lg{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:16px;margin:2px 6px 16px}
.nav .lg small{font-size:11px;color:#8fa0b5;font-weight:600}
.nav button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:0;background:none;color:#cfd6df;font-size:14px;text-align:left;cursor:pointer}
.nav button[aria-pressed=true]{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.nav button em{margin-left:auto;font-style:normal;background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:800}
.nav .me{margin-top:auto;font-size:13px;color:#8fa0b5;padding:8px 10px;border-top:1px solid rgba(255,255,255,.1);text-decoration:none}
.main{padding:18px 22px 60px;max-width:1180px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mh b{font-size:20px}.mh small{color:var(--text-mute)}.mh .r{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--text-sub);font-size:12.5px;font-weight:700}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.2;margin-top:4px}
.kpi span{font-size:12px;color:var(--green);font-weight:700}.kpi span.dn{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;margin-top:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ct strong{font-size:15px}.ct .t{color:var(--text-mute);font-size:12.5px}.ct .r{margin-left:auto}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid #eee;font-size:14px}
.tk:first-of-type{border-top:0}.tk small{display:block;color:var(--text-mute);font-size:12.5px;margin-top:2px}
.tk .w{color:var(--red);font-size:12px;font-weight:800;white-space:nowrap}
.src{font-size:11.5px;font-weight:800;line-height:1;border-radius:6px;padding:4px 6px;white-space:nowrap}
.src.app{background:#eef1f6;color:#3b4b66}.src.web{background:#FBF0DC;color:#9a6512}.src.nfc{background:var(--mint);color:var(--green)}
.co{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid #eee;font-size:14px}
.co:first-of-type{border-top:0}.co small{grid-column:1/-1;color:var(--text-mute);font-size:12.5px}
.co .u{font-weight:800;font-size:13px}.co .u.z{color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--text-mute)}
.bars b{font-size:11.5px;color:var(--text-sub)}
.bars i{display:block;width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:#c9d6cf}
.bars div:last-child i{background:var(--green)}
.legend{font-size:12px;color:var(--text-mute);margin-top:6px}
.rule{margin-top:12px;font-size:13px;color:var(--text-sub);background:var(--soft);border-radius:12px;padding:10px 14px}
.empty{font-size:13px;color:var(--text-mute);padding:10px 0}
.err{background:var(--red-light);color:var(--red);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--border);background:#fff;color:var(--text-sub);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.it{border-top:1px solid #eee;padding:12px 0}.it:first-child{border-top:0}
.it .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.it .h .t{color:var(--text-mute)}
.st{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--text-sub)}.st.open{background:var(--orange-light);color:var(--orange)}
.it .b{margin-top:6px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.it .ua{margin-top:4px;font-size:11.5px;color:var(--text-mute);word-break:break-all}
.ct2{margin-top:6px;font-size:13px;color:var(--text-sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ans{margin-top:8px;background:var(--soft);border-radius:10px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap}.ans small{display:block;color:var(--text-sub);font-size:12px}
.it textarea{width:100%;min-height:64px;margin-top:8px;border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ops-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;z-index:2000}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;background:none}
  .nav{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;z-index:5}
  .nav .lg{margin:0 8px 0 2px}.nav .me{margin:0 0 0 auto;border:0;padding:8px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.main{padding:14px 12px 50px}
}
</style>
</head>
<body>
<div id="app"><div class="gate"><b>불러오는 중</b></div></div>
<script type="module">
import { mountOps } from '../adapter/opsdash.js'
mountOps(document.getElementById('app')).catch((e) => { document.getElementById('app').innerHTML = `<div class="gate"><b>열지 못했어요</b><p>${String(e && e.message || e).replace(/</g, '&lt;')}</p></div>` })
</script>
</body>
</html>
