name: WeVape Monthly Report

on:
  schedule:
    # 한국시간(KST) 매월 1일 오전 10:30 = UTC 01:30 (전날 UTC 기준 매월 1일)
    - cron: '30 1 1 * *'
  workflow_dispatch: {}

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-docx

      - name: Run monthly report script
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
        run: python scripts/monthly_report.py
